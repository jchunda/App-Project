<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Usambazi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#F1F5F1; --surface:#FFFFFF; --surface-2:#E7EEE8; --ink:#13221B; --muted:#53655B;
  --line:#D4DDD6; --line-strong:#AFBFB4;
  --primary:#0E5C43; --on-primary:#FFFFFF; --bar:#0D4F3A; --on-bar:#FFFFFF;
  --copper:#A5561B; --copper-light:#D9A57A; --copper-soft:#F5E6D8; --copper-ink:#6E3510;
  --ok:#16703E; --ok-bg:#DFF0E4; --wait:#975400; --wait-bg:#FBEACF; --bad:#B3261E; --bad-bg:#FADFDB;
  --info-bg:#E2ECF5; --focus:#C98A10;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1814; --surface:#16231D; --surface-2:#1E2E26; --ink:#E5EEE8; --muted:#9CB0A4;
    --line:#2A3B33; --line-strong:#466055;
    --primary:#45B98D; --on-primary:#06231A; --bar:#0F3A2C; --on-bar:#F1F7F3;
    --copper:#D98B4E; --copper-light:#8A5226; --copper-soft:#2B2017; --copper-ink:#F0BC92;
    --ok:#6FD39A; --ok-bg:#173826; --wait:#F2B866; --wait-bg:#3A2B12; --bad:#FF8C80; --bad-bg:#40201C;
    --info-bg:#1B2A38; --focus:#F2B866;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1814; --surface:#16231D; --surface-2:#1E2E26; --ink:#E5EEE8; --muted:#9CB0A4;
  --line:#2A3B33; --line-strong:#466055;
  --primary:#45B98D; --on-primary:#06231A; --bar:#0F3A2C; --on-bar:#F1F7F3;
  --copper:#D98B4E; --copper-light:#8A5226; --copper-soft:#2B2017; --copper-ink:#F0BC92;
  --ok:#6FD39A; --ok-bg:#173826; --wait:#F2B866; --wait-bg:#3A2B12; --bad:#FF8C80; --bad-bg:#40201C;
  --info-bg:#1B2A38; --focus:#F2B866;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.15;margin:0;font-weight:800;letter-spacing:-0.01em}
p{margin:0}
img,svg{max-width:100%}
button{font:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);color:var(--on-bar)}
.topbar-inner{max-width:1100px;margin:0 auto;padding:10px 16px 12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.brand-row{display:flex;align-items:baseline;gap:10px}
.brand{background:none;border:0;color:inherit;padding:0;cursor:pointer;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:26px;letter-spacing:-0.025em}
.proto{font-size:12.5px;opacity:.8}
.viewas{display:flex;align-items:center;gap:8px;font-size:14px}
.seg{display:inline-flex;background:rgba(255,255,255,.13);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:inherit;font-size:14px;padding:6px 12px;border-radius:999px;min-height:36px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#FFFFFF;color:#0D4F3A;font-weight:700}
.who{width:100%;font-size:14px;opacity:.92}

/* Layout */
.layout{max-width:1100px;margin:0 auto}
.content{padding:16px 16px calc(100px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto;outline:none}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:4px 2px calc(4px + env(safe-area-inset-bottom,0px))}
.nav button{position:relative;background:none;border:0;color:var(--muted);font-size:11.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 0;min-height:56px;cursor:pointer;border-radius:10px}
.nav button[aria-current="page"]{color:var(--primary);font-weight:700}
.nav svg{width:24px;height:24px}
.badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
@media (min-width:900px){
  .layout.has-nav{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding:0 16px}
  .nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);align-self:start;display:flex;flex-direction:column;gap:2px;border:0;background:transparent;padding:24px 0}
  .nav button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:15.5px;padding:10px 14px;min-height:46px}
  .nav button[aria-current="page"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--primary)}
  .badge{position:static;margin-left:auto}
  .content{padding-bottom:56px}
  .layout.has-nav .content{margin:0;padding-left:0;padding-right:0}
}

/* Headings and sections */
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--primary);font-weight:700;padding:8px 0;cursor:pointer;min-height:44px}
.back svg{width:18px;height:18px}
.group-head h1{font-size:clamp(24px,6.4vw,30px)}
.group-sub{color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.type-badge{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);color:var(--ink);font-weight:700;font-size:13.5px;padding:3px 10px;border-radius:6px}
.type-badge svg{width:14px;height:14px}
.page-title{font-size:clamp(28px,8vw,36px);margin-top:8px}
.lede{color:var(--muted);margin-top:8px;max-width:60ch}
.section{margin-top:28px}
.section > h2,.screen-head h2{font-size:21px}
.section > .sub{color:var(--muted);margin-top:4px;font-size:15px}
.screen-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:20px}

/* Lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:12px}
.list > * + *{border-top:1px solid var(--line)}
.row{padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.row .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.meta{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.role-tag{display:inline-block;font-size:12.5px;font-weight:700;color:var(--primary);border:1.5px solid currentColor;border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}

/* Home group rows */
.grow{width:100%;display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:left;background:var(--surface);border:0;color:inherit;padding:16px;cursor:pointer}
.grow:hover{background:var(--surface-2)}
.grow-name{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:19px;line-height:1.2}
.grow-meta{display:block;color:var(--muted);font-size:14.5px;margin:3px 0 6px}
.grow-amt{text-align:right;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:20px;white-space:nowrap}
.grow-amt small{display:block;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:400;font-size:13px;color:var(--muted)}

/* Where is the money */
.money{background:var(--copper-soft);border-radius:22px;padding:20px 18px 18px;margin-top:18px}
.money h2{font-size:18px;color:var(--copper-ink)}
.money-total{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(42px,12vw,60px);letter-spacing:-0.035em;line-height:1;margin-top:10px;font-variant-numeric:tabular-nums}
.money-sub{color:var(--muted);margin-top:4px}
.mbar{display:flex;height:22px;border-radius:999px;overflow:hidden;background:var(--line);margin:16px 0 10px}
.mbar span{display:block;height:100%}
.sw-bank{background:var(--primary)}
.sw-momo{background:var(--copper)}
.sw-cash{background:repeating-linear-gradient(135deg,var(--copper) 0 5px,var(--copper-light) 5px 10px)}
.legend{list-style:none;margin:0;padding:0}
.legend li{display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:center;padding:7px 0}
.legend li + li{border-top:1px solid rgba(110,53,16,.15)}
.legend .sw{width:16px;height:16px;border-radius:4px}
.legend .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.legend .pct{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.warn{background:var(--surface);border-left:4px solid var(--wait);border-radius:10px;padding:12px 14px;margin-top:14px}
.warn p + p,.warn p + .btn{margin-top:8px}

/* Status pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;line-height:1.5}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.wait{background:var(--wait-bg);color:var(--wait)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.none{background:var(--surface-2);color:var(--muted)}

/* Attention list */
.att{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:0;color:inherit;padding:13px 16px;cursor:pointer}
.att:hover{background:var(--surface-2)}
.att .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px}
.att .dot.bad{background:var(--bad)} .att .dot.wait{background:var(--wait)} .att .dot.ok{background:var(--ok)}
.att strong{display:block}
.att span.meta{display:block}

/* Progress */
.progress{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:10px}
.progress span{display:block;height:100%;background:var(--ok)}
.month-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.big{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}

/* Entries */
.entry{padding:14px 16px}
.entry-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.entry .amt{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:21px;font-variant-numeric:tabular-nums;white-space:nowrap}
.entry.superseded .amt{text-decoration:line-through;color:var(--muted)}
.entry .meta{margin-top:4px}
.entry-status{margin-top:8px}
.note{border-radius:8px;padding:8px 11px;font-size:14.5px;margin-top:8px}
.note.bad{background:var(--bad-bg)}
.note.info{background:var(--info-bg)}
.note.plain{background:var(--surface-2);color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* Tabs */
.tabs{display:flex;gap:4px;margin-top:16px;background:var(--surface-2);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 10px;border-radius:9px;cursor:pointer;min-height:44px;font-weight:700}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.filter{display:flex;align-items:center;gap:10px;margin-top:12px}
.filter label{margin:0;font-weight:400;color:var(--muted);white-space:nowrap}
.filter select{max-width:280px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1.5px solid var(--primary);background:var(--primary);color:var(--on-primary);font-weight:700;cursor:pointer;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--primary)}
.btn.small{min-height:42px;padding:0 14px;font-size:15px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger-ghost{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--primary);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:8px 0;cursor:pointer;min-height:40px}

/* Forms */
.formcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 16px 18px;margin-top:14px}
.field{margin-top:16px}
.field > label,.field > .label{display:block;font-weight:700;margin-bottom:6px}
.hint{font-size:14px;color:var(--muted);margin-top:5px}
input[type=text],input[type=number],input[type=date],input[type=tel],select,textarea{width:100%;font:inherit;font-size:16px;min-height:48px;padding:10px 12px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-flex;align-items:center;min-height:44px;padding:0 15px;border:1.5px solid var(--line-strong);border-radius:999px;cursor:pointer;background:var(--surface)}
.chip input:checked + span{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:700}
.chip input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.typecards{display:grid;gap:10px}
@media (min-width:560px){.typecards{grid-template-columns:1fr 1fr}}
.typecard{position:relative;display:block}
.typecard input{position:absolute;opacity:0;width:1px;height:1px}
.typecard .tc{display:block;border:1.5px solid var(--line-strong);border-radius:14px;padding:14px;cursor:pointer;height:100%;background:var(--surface)}
.typecard .tc strong{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:18px}
.typecard .tc span{display:block;color:var(--muted);font-size:14.5px;margin-top:4px}
.typecard input:checked + .tc{border-color:var(--primary);box-shadow:inset 0 0 0 1.5px var(--primary);background:var(--ok-bg)}
.typecard input:focus-visible + .tc{outline:3px solid var(--focus);outline-offset:2px}
.errors{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:11px 14px;margin-top:14px;font-weight:700}
.errors ul{margin:4px 0 0;padding-left:18px;font-weight:400;color:var(--ink)}
.infobox{background:var(--info-bg);border-radius:10px;padding:12px 14px;margin-top:14px}
.warnbox{background:var(--wait-bg);border-radius:10px;padding:12px 14px;margin-top:14px}
.mrow{display:grid;grid-template-columns:1fr;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
@media (min-width:560px){.mrow{grid-template-columns:1.4fr 1fr 1fr auto;align-items:end}}
.mrow .x{min-height:48px}
.srcrow{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.srcrow:first-of-type{border-top:0}
.form-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}

/* Requests */
.req{padding:15px 16px}
.req-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.req h3{font-size:17.5px}
.votes{list-style:none;padding:0;margin:10px 0 0}
.votes li{font-size:14.5px;padding:3px 0;display:flex;gap:8px}
.votes .v-yes{color:var(--ok);font-weight:700}
.votes .v-no{color:var(--bad);font-weight:700}
.rule{font-size:14px;color:var(--muted);margin-top:6px}

/* Rotation */
.rot{list-style:none;margin:12px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rot li{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:12px 16px;align-items:center}
.rot li + li{border-top:1px solid var(--line)}
.rot .n{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.rot li.done .n{background:var(--ok-bg);color:var(--ok)}
.rot li.now{background:var(--copper-soft)}
.rot li.now .n{background:var(--copper);color:#fff}
.rot .rname{font-weight:700}
.rot .rinfo{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:2px}
.hero{background:var(--copper-soft);border-radius:20px;padding:18px;margin-top:16px}
.hero h2{font-size:22px;color:var(--copper-ink)}
.hero .who-big{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(28px,8vw,38px);letter-spacing:-0.02em;margin-top:6px;line-height:1.1}

/* Share-out */
.calc{list-style:none;margin:12px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.calc li{display:flex;justify-content:space-between;gap:12px;padding:11px 16px}
.calc li + li{border-top:1px solid var(--line)}
.calc li.total{font-weight:700;background:var(--surface-2)}
.calc .v{font-variant-numeric:tabular-nums;white-space:nowrap}
.steps{margin:10px 0 0;padding-left:22px}
.steps li{padding:3px 0}
details.share{padding:0}
details.share summary{list-style:none;cursor:pointer;padding:13px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
details.share summary::-webkit-details-marker{display:none}
details.share summary .pct{color:var(--muted);font-size:14px}
details.share summary .get{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
details.share summary .open-hint{font-size:13.5px;color:var(--primary);font-weight:700}
details.share[open] summary{background:var(--surface-2)}
details.share .body{padding:6px 16px 14px}
.future{border:1.5px dashed var(--line-strong);border-radius:12px;padding:12px 14px;margin-top:16px;color:var(--muted)}

/* Type lock */
.typelock{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px}
.typelock svg{width:22px;height:22px;flex:none;margin-top:2px;color:var(--muted)}

/* History */
.hentry{padding:12px 16px;display:grid;grid-template-columns:1fr;gap:2px}
.hentry .who-line{font-weight:700}
.hentry .when{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Modal and toast */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,15,10,.5);display:flex;align-items:flex-end;justify-content:center}
.dialog{background:var(--surface);color:var(--ink);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.dialog h2{font-size:21px}
.dialog-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
@media (min-width:640px){.overlay{align-items:center}.dialog{border-radius:20px}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:60;max-width:calc(100% - 32px);font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
@media (min-width:900px){.toast{bottom:28px}}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}}
.empty{padding:22px 16px;color:var(--muted);text-align:center}

/* Version 2 additions */
.viewas label{font-size:14px}
.viewas select{width:auto;max-width:68vw;min-height:38px;padding:4px 12px;border-radius:999px;border:0;background:#FFFFFF;color:#0D4F3A;font-weight:700;font-size:15px}
.sw-lent{background:repeating-linear-gradient(135deg,var(--primary) 0 5px,var(--surface) 5px 10px)}
.nav .desk{display:none}
@media (min-width:900px){.nav .desk{display:flex}}
.calcbox{background:var(--info-bg);border-radius:12px;padding:12px 14px;margin-top:16px}
.calcbox h3{font-size:17px}
.calcbox .steps{margin-top:6px}

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
(function(){
'use strict';

/* ---------- Basic helpers ---------- */
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const SM=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const METHODS=[
  {id:'airtel',label:'Airtel Money',loc:'momo',needsRef:true,hint:'Copy it from the Airtel Money message, e.g. MP261003.0914.A47215'},
  {id:'mtn',label:'MTN MoMo',loc:'momo',needsRef:true,hint:'Copy it from the MTN MoMo message, e.g. 4471029385'},
  {id:'zamtel',label:'Zamtel Kwacha',loc:'momo',needsRef:true,hint:'Copy it from the Zamtel Kwacha message, e.g. ZK20481937'},
  {id:'cash',label:'Cash',loc:'cash',needsRef:false,hint:''},
  {id:'bank',label:'Bank',loc:'bank',needsRef:false,hint:'The number on the bank deposit slip (optional).'}
];
const M=id=>METHODS.find(m=>m.id===id);
const ROLE={chair:'Chairperson',vice:'Vice Chairperson',treasurer:'Treasurer',comms:'Communications',rep:'Member representative',member:'Member'};
const ROLE_ORDER=['chair','vice','treasurer','comms','rep','member'];
const TYPE={chilimba:'Chilimba',village:'Village Banking'};
const MAXM={chilimba:20,village:35};
const MINM=5, MIN_COMMITTEE=4;

const S={groups:[],gid:null,role:'treasurer',screen:'home',payTab:'mine',payMonth:'all',histLimit:40,draft:null,reqKind:null,modalSave:null};

let uid=100; const nid=p=>p+(uid++);
let sd=20261003; const rnd=()=>{sd=(sd*1103515245+12345)%2147483648;return sd/2147483648};
const dg=n=>{let s='';for(let i=0;i<n;i++)s+=Math.floor(rnd()*10);return s};
const p2=n=>String(n).padStart(2,'0');
function makeRef(method,d){
  if(method==='airtel')return 'MP'+String(d.getFullYear()).slice(2)+p2(d.getMonth()+1)+p2(d.getDate())+'.'+p2(d.getHours())+p2(d.getMinutes())+'.'+'ABCDEFGHJK'[Math.floor(rnd()*10)]+dg(5);
  if(method==='mtn')return String(1+Math.floor(rnd()*9))+dg(9);
  if(method==='zamtel')return 'ZK'+dg(8);
  if(method==='bank')return 'Slip '+dg(6);
  return '';
}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round(n*100)/100;
const fmtK=n=>{const v=r2(n);const a=Math.abs(v);return (v<0?'−':'')+'K'+a.toLocaleString('en-US',{minimumFractionDigits:a%1?2:0,maximumFractionDigits:2})};
const fmtD=d=>d.getDate()+' '+SM[d.getMonth()]+' '+d.getFullYear();
const fmtDT=d=>fmtD(d)+', '+p2(d.getHours())+':'+p2(d.getMinutes());
const sum=(a,f)=>a.reduce((t,x)=>t+(f?f(x):x),0);
const at=(g,m,day,h,mi)=>new Date(g.startY,g.startM+m-1,day,h,mi||0);
const monthLabel=(g,m)=>{const d=new Date(g.startY,g.startM+m-1,1);return MONTHS[d.getMonth()]+' '+d.getFullYear()};
const mLabel=(g,m)=>'Month '+m+' ('+monthLabel(g,m)+')';
const plural=(n,one,many)=>n+' '+(n===1?one:many);
const normRef=r=>String(r||'').toUpperCase().replace(/\s+/g,'');
const pctTxt=n=>(Math.round(n*10)/10).toString().replace(/\.0$/,'')+'%';

/* ---------- Group data helpers ---------- */
const cur=()=>S.groups.find(g=>g.id===S.gid)||null;
const mem=(g,id)=>g.members.find(m=>m.id===id);
const nm=(g,id)=>id?((mem(g,id)||{}).name||'Someone'):'Usambazi';
const first=(g,id)=>nm(g,id).split(' ')[0];
const byRole=(g,r)=>g.members.find(m=>m.role===r);
const treasurerId=g=>byRole(g,'treasurer').id;
function viewerId(g){
  if(S.role!=='member'){const m=byRole(g,S.role);if(m)return m.id}
  return g.memberView||(byRole(g,'member')||g.members[0]).id;
}
const viewer=g=>mem(g,viewerId(g));
const isAdminId=(g,id)=>{const m=mem(g,id);return !!m&&m.role!=='member'};
const isAdm=g=>viewer(g).role!=='member';
const isT=g=>viewer(g).role==='treasurer';
const isComms=g=>viewer(g).role==='comms';
const privateView=g=>g.type==='village'&&!isAdm(g);
const committee=g=>g.members.filter(m=>m.role!=='member');
const active=g=>g.contributions.filter(c=>!c.supersededBy);
function hist(g,actor,text,time,subject){g.history.push({id:nid('h'),actor,text,time:time||new Date(),subject:subject||null})}
const histVisible=(g,h)=>!privateView(g)||!h.subject||h.subject===viewerId(g);

function monthStatus(g,mid,m){
  const list=active(g).filter(c=>c.memberId===mid&&c.month===m);
  if(!list.length)return {status:'notpaid',amount:0,confirmed:0};
  let st='confirmed';
  if(list.some(c=>c.status==='disputed'))st='disputed';
  else if(list.some(c=>c.status==='waiting'))st='waiting';
  return {status:st,amount:sum(list,c=>c.amount),confirmed:sum(list.filter(c=>c.status==='confirmed'),c=>c.amount)};
}
const savedBy=(g,id)=>r2(sum(active(g).filter(c=>c.memberId===id&&c.status==='confirmed'),c=>c.amount));
const savedConfirmed=g=>r2(sum(active(g).filter(c=>c.status==='confirmed'),c=>c.amount));

/* ---------- Loan maths (flat interest, interest paid first) ---------- */
function lcalc(g,l){
  const rate=g.loanRate/100;
  const interest=r2(l.amount*rate*l.months);
  const total=r2(l.amount+interest);
  const monthly=r2(total/l.months);
  const paid=r2(sum(l.repayments,r=>r.amount));
  const paidConf=r2(sum(l.repayments.filter(r=>r.status==='confirmed'),r=>r.amount));
  const remaining=r2(Math.max(0,total-paid));
  const interestPaid=r2(Math.min(paid,interest));
  const interestConf=r2(Math.min(paidConf,interest));
  const principalPaid=r2(Math.max(0,paid-interest));
  const outstanding=l.sentAt?r2(Math.max(0,l.amount-principalPaid)):0;
  const dueMonth=l.startMonth?l.startMonth+l.months:null;
  const overdue=!!l.sentAt&&remaining>0&&g.currentMonth>dueMonth;
  return {interest,total,monthly,paid,paidConf,remaining,interestPaid,interestConf,principalPaid,outstanding,dueMonth,overdue};
}
const lentOut=g=>r2(sum(g.loans,l=>lcalc(g,l).outstanding));
const interestEarned=g=>r2(sum(g.loans,l=>lcalc(g,l).interestConf));
const openLoan=(g,id)=>g.loans.find(l=>l.memberId===id&&['requested','approved','active'].includes(l.status));
function loanSteps(g,amount,months,you){
  const rate=g.loanRate,per=r2(amount*rate/100),interest=r2(per*months),total=r2(amount+interest),monthly=r2(total/months);
  const w=you?'You':'They';
  return `<ol class="steps">
    <li>${w} borrow <strong>${fmtK(amount)}</strong>.</li>
    <li>Interest is ${rate}% of ${fmtK(amount)} for each month: <strong>${fmtK(per)} a month</strong>.</li>
    <li>For ${plural(months,'month','months')}, that is ${fmtK(per)} × ${months} = <strong>${fmtK(interest)} interest</strong>.</li>
    <li>${w} pay back ${fmtK(amount)} + ${fmtK(interest)} = <strong>${fmtK(total)}</strong>.</li>
    <li>That is <strong>${fmtK(monthly)} a month</strong> for ${plural(months,'month','months')}.</li></ol>`;
}

function holdings(g){
  const h={bank:0,momo:0,cash:0};
  active(g).forEach(c=>{h[M(c.method).loc]+=c.amount});
  g.income.forEach(i=>{h[i.loc]+=i.amount});
  g.transfers.forEach(t=>{h[t.from]-=t.amount;h[t.to]+=t.amount});
  g.outgoing.filter(o=>o.status==='approved'&&o.sources).forEach(o=>{for(const k in o.sources)h[k]-=o.sources[k]});
  g.loans.forEach(l=>{if(l.sentSources)for(const k in l.sentSources)h[k]-=l.sentSources[k];l.repayments.forEach(r=>{h[M(r.method).loc]+=r.amount})});
  for(const k in h)h[k]=r2(h[k]);
  return h;
}
const voted=(o,id)=>o.approvals.some(a=>a.id===id)||o.rejections.some(r=>r.id===id);
function canVote(g,o,id){return o.status==='pending'&&isAdminId(g,id)&&o.requestedBy!==id&&!voted(o,id)}
function attentionCount(g){
  const a=active(g);
  return a.filter(c=>c.status==='waiting'||c.status==='disputed').length+g.outgoing.filter(o=>o.status==='pending').length+g.loans.filter(l=>lcalc(g,l).overdue).length;
}
const srcName=(g,k)=>{const t=nm(g,treasurerId(g));return k==='bank'?'the group bank account':k==='momo'?t+"'s mobile money":'cash kept by '+t};
const locName=(g,k)=>{const t=nm(g,treasurerId(g));return k==='bank'?'Group bank account':k==='momo'?t+"'s mobile money":'Cash kept by '+t};

/* ---------- Actions on data ---------- */
function addContrib(g,o){
  const c=Object.assign({id:nid('p'),status:'waiting',note:''},o);
  if(c.ref===undefined)c.ref=makeRef(c.method,c.time);
  g.contributions.push(c);
  hist(g,c.recordedBy,`Recorded ${fmtK(c.amount)} from ${nm(g,c.memberId)} for ${mLabel(g,c.month)}. Paid by ${M(c.method).label}${c.ref?', reference '+c.ref:''}.`,c.time,c.memberId);
  return c;
}
function confirmC(g,c,time){
  c.status='confirmed';c.confirmedAt=time||new Date();
  hist(g,c.memberId,`Confirmed that the ${fmtK(c.amount)} payment for Month ${c.month} is correct.`,c.confirmedAt,c.memberId);
}
function disputeC(g,c,reason,time){
  c.status='disputed';c.disputeNote=reason;c.disputedAt=time||new Date();
  hist(g,c.memberId,`Said the ${fmtK(c.amount)} payment recorded for Month ${c.month} is wrong: "${reason}"`,c.disputedAt,c.memberId);
}
function addCorrection(g,orig,o){
  const time=new Date();
  const c={id:nid('p'),memberId:orig.memberId,month:orig.month,amount:o.amount,method:o.method,ref:o.ref,time,recordedBy:treasurerId(g),status:'waiting',correctionOf:orig.id,note:o.reason};
  g.contributions.push(c);orig.supersededBy=c.id;orig.supersededAt=time;
  hist(g,c.recordedBy,`Added a correction to ${nm(g,orig.memberId)}'s Month ${orig.month} payment: ${fmtK(orig.amount)} changed to ${fmtK(c.amount)}. Reason: "${o.reason}". The original entry is kept.`,time,orig.memberId);
  return c;
}
function outTitle(g,o){
  if(o.kind==='payout')return `Pay ${fmtK(o.amount)} to ${nm(g,o.to)} (Month ${o.month} receiver)`;
  if(o.kind==='typechange')return `Change the group type to ${TYPE[o.newType]}`;
  if(o.kind==='loan')return `Loan of ${fmtK(o.amount)} to ${nm(g,o.to)} for ${plural(o.months,'month','months')}`;
  return `Spend ${fmtK(o.amount)}: ${o.reason}`;
}
function addOut(g,o){
  const x=Object.assign({id:nid('o'),status:'pending',approvals:[],rejections:[],createdAt:o.time||new Date(),subject:null},o);
  delete x.time;
  x.title=outTitle(g,x);
  g.outgoing.push(x);
  hist(g,x.requestedBy,`Asked for approval: ${x.title}.${x.kind==='loan'?' Reason: "'+x.reason+'"':''}`,x.createdAt,x.subject);
  return x;
}
function evaluate(g,o,time){
  if(o.status!=='pending')return;
  const chairId=byRole(g,'chair').id;
  const leads=g.members.filter(m=>m.role==='chair'||m.role==='vice').map(m=>m.id);
  const voters=committee(g).filter(m=>m.id!==o.requestedBy).length;
  const loan=o.kind==='loan'?g.loans.find(l=>l.id===o.loanId):null;
  if(o.rejections.some(r=>r.id===chairId)||o.rejections.length>voters/2){
    o.status='rejected';o.decidedAt=time;if(loan)loan.status='rejected';
    hist(g,null,`Rejected: ${o.title}.${o.kind==='typechange'?'':' No money was moved.'}`,time,o.subject);return;
  }
  const yes=o.approvals.map(a=>a.id);
  if(yes.length>=2&&yes.some(id=>leads.includes(id))){
    o.status='approved';o.decidedAt=time;
    let msg=`Approved: ${o.title}. The money is now counted as paid out.`;
    if(o.kind==='typechange')msg=`Approved: ${o.title}. It will start with the next cycle.`;
    if(loan){loan.status='approved';msg=`Approved: ${o.title}. The treasurer can now send the money.`}
    hist(g,null,msg,time,o.subject);
  }
}
function vote(g,o,id,kind,time,reason){
  time=time||new Date();
  if(kind==='yes'){o.approvals.push({id,time});hist(g,id,`Voted yes on: ${o.title}.`,time,o.subject)}
  else{o.rejections.push({id,time,reason:reason||''});hist(g,id,`Voted no on: ${o.title}.${reason?' Reason: "'+reason+'"':''}`,time,o.subject)}
  evaluate(g,o,time);
}
const RULE_TEXT='Needs a yes from 2 committee members, including the chairperson or vice chairperson. The person asking cannot vote.';

/* Loans */
function requestLoan(g,who,amount,months,purpose,time){
  const l={id:nid('l'),memberId:who,amount,months,purpose,status:'requested',repayments:[],requestedAt:time};
  g.loans.push(l);
  const o=addOut(g,{kind:'loan',loanId:l.id,amount,months,to:who,reason:purpose,requestedBy:who,subject:who,time});
  l.approvalId=o.id;
  return {l,o};
}
function sendLoan(g,l,src,ref,time,month){
  l.sentAt=time;l.sentSources={[src]:l.amount};l.sentRef=ref;l.startMonth=month;l.status='active';
  hist(g,treasurerId(g),`Sent the ${fmtK(l.amount)} loan to ${nm(g,l.memberId)} from ${srcName(g,src)}. Reference: ${ref}.`,time,l.memberId);
}
function confirmLoanReceived(g,l,time){
  l.receivedAt=time||new Date();
  hist(g,l.memberId,`Confirmed receiving the ${fmtK(l.amount)} loan.`,l.receivedAt,l.memberId);
}
function addRepay(g,l,o){
  const r={id:nid('r'),amount:o.amount,method:o.method,ref:o.ref===undefined?makeRef(o.method,o.time):o.ref,time:o.time,month:o.month,status:'waiting',recordedBy:treasurerId(g)};
  l.repayments.push(r);
  hist(g,r.recordedBy,`Recorded a loan repayment of ${fmtK(r.amount)} from ${nm(g,l.memberId)}. Paid by ${M(r.method).label}${r.ref?', reference '+r.ref:''}.`,r.time,l.memberId);
  if(lcalc(g,l).remaining<=0&&l.status!=='repaid'){l.status='repaid';hist(g,null,`${nm(g,l.memberId)}'s loan of ${fmtK(l.amount)} is fully repaid.`,r.time,l.memberId)}
  return r;
}
function confirmRepay(g,l,r,time){r.status='confirmed';r.confirmedAt=time||new Date();hist(g,l.memberId,`Confirmed the ${fmtK(r.amount)} loan repayment is correct.`,r.confirmedAt,l.memberId)}
function disputeRepay(g,l,r,reason){r.status='disputed';r.disputeNote=reason;hist(g,l.memberId,`Said the ${fmtK(r.amount)} loan repayment is wrong: "${reason}"`,new Date(),l.memberId)}

/* ---------- Demo data ---------- */
function blankGroup(o){return Object.assign({contributions:[],outgoing:[],transfers:[],income:[],history:[],rotation:[],loans:[],loanRate:10,loanMultiple:3,loanMaxMonths:3},o)}
const mkMembers=list=>list.map(([id,name,role,phone])=>({id,name,role,phone}));
function seedChilimba(){
  const g=blankGroup({id:'g1',name:"Kalingalinga Women's Chilimba",type:'chilimba',amount:500,cycle:8,currentMonth:4,startY:2026,startM:6,memberView:'c3'});
  g.members=mkMembers([['c1','Mwila Banda','chair','097 214 5521'],['c2','Chanda Phiri','treasurer','096 880 1290'],['c3','Bwalya Mulenga','member','077 301 4478'],['c4','Mutale Zulu','vice','095 642 0913'],['c5','Thandiwe Lungu','member','097 559 2306'],['c6','Natasha Tembo','comms','096 118 7724'],['c7','Precious Chileshe','rep','076 903 5512'],['c8','Memory Sakala','member','095 270 3369']]);
  g.rotation=['c4','c6','c8','c3','c7','c5','c1','c2'];
  const how={c1:'mtn',c2:'cash',c3:'airtel',c4:'airtel',c5:'airtel',c6:'bank',c7:'mtn',c8:'zamtel'};
  const T='c2';
  hist(g,'c1','Created the group as a Chilimba: 8 members, K500 each per month, 8-month cycle.',new Date(2026,5,27,16,5));
  hist(g,'c1','Set up the committee: chairperson, vice chairperson, treasurer, communications and a member representative.',new Date(2026,5,27,16,9));
  hist(g,'c1','Set the order for receiving the pot. The treasurer, Chanda Phiri, receives last.',new Date(2026,5,27,16,12));
  for(let m=1;m<=3;m++){
    g.members.forEach((mb,i)=>{
      const t=at(g,m,1+(i%4),7+i,(i*13+m*7)%60);
      const c=addContrib(g,{memberId:mb.id,amount:500,month:m,method:how[mb.id],time:t,recordedBy:T});
      confirmC(g,c,new Date(t.getTime()+(1+i%3)*3600e3+17*60e3));
    });
    const t=at(g,m,6,15,30);
    const o=addOut(g,{kind:'payout',month:m,to:g.rotation[m-1],amount:4000,sources:{momo:3000,cash:500,bank:500},reason:'',requestedBy:T,time:t});
    vote(g,o,'c1','yes',new Date(t.getTime()+40*60e3));
    vote(g,o,m===1?'c6':m===2?'c4':'c7','yes',new Date(t.getTime()+95*60e3));
  }
  const plan=[['c1','confirmed',1,8,5],['c2','confirmed',1,8,40],['c4','confirmed',2,12,15],['c6','confirmed',2,14,2],['c5','disputed',2,18,22],['c3','waiting',3,9,12],['c7','waiting',3,10,40]];
  plan.forEach(([id,st,day,h,mi])=>{
    const t=at(g,4,day,h,mi);
    const c=addContrib(g,{memberId:id,amount:id==='c5'?300:500,month:4,method:how[id],time:t,recordedBy:T});
    if(st==='confirmed')confirmC(g,c,new Date(t.getTime()+2*3600e3));
    if(st==='disputed')disputeC(g,c,'I sent K500 on Airtel Money, not K300. My Airtel message shows K500.',new Date(t.getTime()+3*3600e3));
  });
  const w=addOut(g,{kind:'withdrawal',amount:60,sources:{cash:60},reason:'Buy a receipt book and airtime for payment reminders',requestedBy:T,time:at(g,4,2,17,30)});
  vote(g,w,'c4','yes',at(g,4,2,19,5));
  return g;
}
function seedVillage(){
  const g=blankGroup({id:'g2',name:'Matero Village Savings',type:'village',amount:100,cycle:12,currentMonth:6,startY:2026,startM:4,memberView:'v3'});
  g.members=mkMembers([['v1','Kelvin Chanda','chair','097 410 2287'],['v2','Agnes Mwale','treasurer','096 225 8013'],['v3','Joseph Tembo','member','077 618 3390'],['v4','Esther Banda','vice','095 334 7125'],['v5','Moses Phiri','member','097 902 4461'],['v6','Ruth Zulu','comms','096 571 0038'],['v7','Peter Lungu','member','076 248 9914'],['v8','Mercy Mulenga','rep','095 863 2207'],['v9','Davies Bwalya','member','097 137 5582'],['v10','Brenda Musonda','member','096 690 4475']]);
  const how={v1:'bank',v2:'cash',v3:'mtn',v4:'airtel',v5:'mtn',v6:'zamtel',v7:'cash',v8:'bank',v9:'airtel',v10:'mtn'};
  const base=[400,300,250,500,200,350,150,600,300,200],vary=[0,50,-50,100,0,50];
  const T='v2';
  hist(g,'v1','Created the group as Village Banking: 10 members, at least K100 saved each month, 12-month cycle. Loans: 10% interest a month, up to 3 times your savings, repaid within 3 months.',new Date(2026,3,28,14,0));
  hist(g,'v1','Set up the committee: chairperson, vice chairperson, treasurer, communications and a member representative.',new Date(2026,3,28,14,6));
  g.income.push({id:nid('i'),label:'Registration fees (K50 from each member)',amount:500,loc:'bank',month:1,time:at(g,1,2,10,0)});
  hist(g,T,'Recorded K500 group income: registration fees (K50 from each member), paid into the group bank account.',at(g,1,2,10,0));
  for(let m=1;m<=6;m++){
    g.members.forEach((mb,i)=>{
      if(m===6&&mb.id==='v7')return;
      const amt=Math.max(100,base[i]+vary[(i+m)%6]);
      const t=at(g,m,m===6?1+(i%3):1+(i%5),7+i,(i*11+m*5)%60);
      const c=addContrib(g,{memberId:mb.id,amount:amt,month:m,method:how[mb.id],time:t,recordedBy:T});
      if(!(m===6&&(mb.id==='v3'||mb.id==='v9')))confirmC(g,c,new Date(t.getTime()+(2+i%4)*3600e3));
    });
    if(m===3){g.income.push({id:nid('i'),label:'Late payment fines',amount:200,loc:'cash',month:3,time:at(g,3,6,11,0)});hist(g,T,'Recorded K200 group income: late payment fines, kept as cash.',at(g,3,6,11,0))}
    if(m===5){g.income.push({id:nid('i'),label:'Late payment fines',amount:150,loc:'cash',month:5,time:at(g,5,6,11,30)});hist(g,T,'Recorded K150 group income: late payment fines, kept as cash.',at(g,5,6,11,30))}
    if(m<=5){
      const mc=g.contributions.filter(c=>c.month===m);
      const momo=sum(mc.filter(c=>M(c.method).loc==='momo'),c=>c.amount);
      const cash=sum(mc.filter(c=>M(c.method).loc==='cash'),c=>c.amount)+sum(g.income.filter(i=>i.month===m&&i.loc==='cash'),i=>i.amount);
      const t=at(g,m,8,10,15);
      g.transfers.push({id:nid('t'),from:'momo',to:'bank',amount:momo,time:t,by:T,ref:'Slip '+dg(6)});
      hist(g,T,`Moved ${fmtK(momo)} from mobile money to the group bank account.`,t);
      const t2=at(g,m,8,10,40);
      g.transfers.push({id:nid('t'),from:'cash',to:'bank',amount:cash,time:t2,by:T,ref:'Slip '+dg(6)});
      hist(g,T,`Deposited ${fmtK(cash)} cash into the group bank account.`,t2);
    }
    if(m===2){
      const o=addOut(g,{kind:'withdrawal',amount:120,sources:{bank:120},reason:'Print member savings cards',requestedBy:T,time:at(g,2,15,9,0)});
      vote(g,o,'v1','yes',at(g,2,15,12,10));vote(g,o,'v8','yes',at(g,2,15,13,45));
    }
    if(m===4){
      const o=addOut(g,{kind:'withdrawal',amount:1000,sources:{bank:1000},reason:'Lend money to a friend who is not a member',requestedBy:T,time:at(g,4,18,16,0)});
      vote(g,o,'v4','no',at(g,4,18,18,20),'We only lend to members.');
      vote(g,o,'v1','no',at(g,4,18,19,0),'Our rules do not allow lending to non-members.');
    }
  }
  const loans=[
    {who:'v4',amount:2000,months:2,purpose:'Buy stock for my salon',m:2,day:10,votes:['v1','v6'],pays:[[3,5,1200,'airtel'],[4,5,1200,'airtel']]},
    {who:'v7',amount:800,months:1,purpose:'Pay school fees for my son',m:3,day:12,votes:['v1','v8'],pays:[[4,6,400,'cash']]},
    {who:'v5',amount:1000,months:2,purpose:'Buy seed and fertiliser',m:4,day:9,votes:['v4','v8'],pays:[[5,5,600,'mtn']]},
    {who:'v3',amount:1500,months:3,purpose:'Buy a second-hand sewing machine',m:5,day:10,votes:['v1','v6'],pays:[[6,2,650,'mtn']]}
  ];
  loans.forEach(s=>{
    const t=at(g,s.m,s.day,9,30);
    const {l,o}=requestLoan(g,s.who,s.amount,s.months,s.purpose,t);
    s.votes.forEach((v,i)=>vote(g,o,v,'yes',new Date(t.getTime()+(i+1)*3*3600e3)));
    const ts=at(g,s.m,s.day+2,11,0);
    sendLoan(g,l,'bank','Slip '+dg(6),ts,s.m);
    confirmLoanReceived(g,l,new Date(ts.getTime()+2*3600e3));
    s.pays.forEach(([m,day,amt,method])=>{
      const tr=at(g,m,day,10,20);
      const r=addRepay(g,l,{amount:amt,method,time:tr,month:m});
      confirmRepay(g,l,r,new Date(tr.getTime()+3*3600e3));
      if(m<6){const loc=M(method).loc;const tt=at(g,m,9,9,0);g.transfers.push({id:nid('t'),from:loc,to:'bank',amount:amt,time:tt,by:T,ref:'Slip '+dg(6)});hist(g,T,`Moved ${fmtK(amt)} of loan repayments to the group bank account.`,tt)}
    });
  });
  const pend=requestLoan(g,'v9',1200,2,'Restock my shop',at(g,6,2,9,30));
  vote(g,pend.o,'v6','yes',at(g,6,2,13,15));
  addOut(g,{kind:'withdrawal',amount:45,sources:{bank:45},reason:'Monthly bank account charge',requestedBy:T,time:at(g,6,2,16,20)});
  return g;
}

const PILL={confirmed:['ok','Confirmed','✓'],waiting:['wait','Waiting for confirmation','…'],disputed:['bad','Disputed','!'],notpaid:['none','Not paid yet','–'],pending:['wait','Pending approval','…'],approved:['ok','Approved','✓'],rejected:['bad','Rejected','✕'],corrected:['none','Replaced by a correction','↺'],overdue:['bad','Overdue','!'],repaying:['wait','Being repaid','…'],repaid:['ok','Fully repaid','✓'],tosend:['wait','Approved, waiting to be sent','…']};
