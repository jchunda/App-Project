function moneyCard(g){
  const h=holdings(g),lent=lentOut(g),held=r2(h.bank+h.momo+h.cash),total=r2(held+lent),tName=nm(g,treasurerId(g));
  const tHeld=r2(h.momo+h.cash),share=total>0?tHeld/total:0;
  const keys=[['bank','sw-bank',h.bank,locName(g,'bank')],['momo','sw-momo',h.momo,locName(g,'momo')],['cash','sw-cash',h.cash,locName(g,'cash')]];
  if(g.type==='village')keys.push(['lent','sw-lent',lent,'Lent out to members (being repaid)']);
  const bar=total>0?keys.map(([k,c,v])=>v>0?`<span class="${c}" style="width:${v/total*100}%"></span>`:'').join(''):'';
  const legend=keys.map(([k,c,v,label])=>`<li><span class="sw ${c}"></span><span>${esc(label)}</span><span class="amt">${fmtK(v)}<span class="pct">${total>0?Math.round(v/total*100):0}%</span></span></li>`).join('');
  let warn='';
  if(share>0.5&&tHeld>1000){
    warn=`<div class="warn"><p><strong>${esc(tName)} is holding ${fmtK(tHeld)}, which is ${Math.round(share*100)}% of the group's money.</strong></p><p>It is safer to keep most of it in the group bank account, where taking money out needs more than one signature.</p>${isT(g)?'<button class="btn small" data-action="go" data-screen="move">Move money to the bank</button>':''}</div>`;
  } else if(isT(g)&&tHeld>0){
    warn=`<div style="margin-top:12px"><button class="btn small ghost" data-action="go" data-screen="move">Move money to the bank</button></div>`;
  }
  return `<section class="money" aria-labelledby="money-h"><h2 id="money-h">Where is the money?</h2>
    <p class="money-total">${fmtK(total)}</p><p class="money-sub">${total>0?'belongs to the group right now':'No money is held yet.'}</p>
    ${total>0?`<div class="mbar" aria-hidden="true">${bar}</div><ul class="legend">${legend}</ul>`:''}${warn}</section>`;
}

function overview(g){
  const vid=viewerId(g),a=active(g),cm=g.currentMonth,priv=privateView(g),adm=isAdm(g);
  const myW=a.filter(c=>c.memberId===vid&&c.status==='waiting').length;
  const disp=a.filter(c=>c.status==='disputed').length;
  const waitAll=a.filter(c=>c.status==='waiting').length-myW;
  const pend=g.outgoing.filter(o=>o.status==='pending'&&(!priv||o.kind!=='loan'||o.subject===vid));
  const myVotes=pend.filter(o=>canVote(g,o,vid)).length;
  const notPaid=g.members.filter(mb=>monthStatus(g,mb.id,cm).status==='notpaid');
  const myLoanTodo=g.loans.filter(l=>l.memberId===vid&&((l.sentAt&&!l.receivedAt)||l.repayments.some(r=>r.status==='waiting'))).length;
  const toSend=isT(g)?g.loans.filter(l=>l.status==='approved').length:0;
  const overdue=g.loans.filter(l=>lcalc(g,l).overdue&&(adm||l.memberId===vid));
  const items=[];
  if(myW)items.push(['bad',`You have ${plural(myW,'payment','payments')} to confirm`,'Check it against your mobile money message.','payments','mine']);
  if(myLoanTodo)items.push(['bad','Your loan needs you to confirm something','Check the money you received or repaid.','loans']);
  if(myVotes)items.push(['bad',`${plural(myVotes,'request needs','requests need')} your vote`,'Money cannot leave the group until the committee approves it.','approvals']);
  if(toSend)items.push(['bad',`${plural(toSend,'approved loan is','approved loans are')} waiting for you to send`,'','loans']);
  if(overdue.length)items.push(['bad',`${plural(overdue.length,'loan is','loans are')} overdue`,adm?overdue.map(l=>nm(g,l.memberId)).join(', '):'Please repay as soon as you can.','loans']);
  if(!priv){
    if(disp)items.push(['bad',`${plural(disp,'payment is','payments are')} disputed`,'Everyone can see these until the treasurer adds a correction.','payments','all']);
    if(waitAll>0)items.push(['wait',`${plural(waitAll,'payment is','payments are')} waiting for members to confirm`,'','payments','all']);
    if(pend.length&&!myVotes)items.push(['wait',`${plural(pend.length,'request is','requests are')} waiting for committee approval`,'','approvals']);
  }
  if(notPaid.length)items.push(['wait',`${plural(notPaid.length,'member has','members have')} not paid for Month ${cm} yet`,notPaid.map(m=>m.name).join(', '),'members']);
  const att=items.length?items.map(([c,t,s,scr,tab])=>`<button class="att" data-action="go" data-screen="${scr}"${tab?` data-tab="${tab}"`:''}><span class="dot ${c}"></span><span><strong>${esc(t)}</strong>${s?`<span class="meta">${esc(s)}</span>`:''}</span></button>`).join(''):`<div class="att" style="cursor:default"><span class="dot ok"></span><span><strong>Nothing needs attention right now</strong></span></div>`;

  let month='';
  const conf=sum(g.members,mb=>monthStatus(g,mb.id,cm).confirmed);
  const rows=g.members.map(mb=>{const s=monthStatus(g,mb.id,cm);const showAmt=!priv||mb.id===vid;return `<div class="row"><span>${esc(mb.name)}${mb.id===vid?' <span class="muted">(you)</span>':''}${showAmt?`<span class="meta" style="display:block">${s.amount?fmtK(s.amount)+' recorded':'Nothing recorded'}</span>`:''}</span>${pill(s.status)}</div>`}).join('');
  if(g.type==='chilimba'){
    const pot=g.amount*g.members.length,rec=g.rotation[cm-1];
    month=`<div class="month-head"><span class="big">${fmtK(conf)} <span class="muted" style="font-size:17px;font-weight:600">of ${fmtK(pot)} confirmed</span></span></div>
    <div class="progress" role="img" aria-label="${Math.round(conf/pot*100)}% of the pot confirmed"><span style="width:${Math.min(100,conf/pot*100)}%"></span></div>
    <p class="meta" style="margin-top:8px">This month's pot goes to <strong style="color:var(--ink)">${esc(nm(g,rec))}</strong>.</p>`;
  }else{
    const paid=g.members.filter(mb=>monthStatus(g,mb.id,cm).status!=='notpaid').length;
    month=`<div class="month-head"><span class="big">${fmtK(conf)} <span class="muted" style="font-size:17px;font-weight:600">saved and confirmed this month</span></span></div>
    <p class="meta" style="margin-top:6px">${paid} of ${g.members.length} members have paid. The minimum saving is ${fmtK(g.amount)}.</p>`;
  }
  const typePending=g.outgoing.some(o=>o.kind==='typechange'&&o.status==='pending');
  let totals='';
  if(g.type==='chilimba'){const po=g.outgoing.filter(o=>o.kind==='payout'&&o.status==='approved');totals=`${fmtK(sum(po,o=>o.amount))} paid out so far to ${plural(po.length,'member','members')}.`}
  else totals=`${fmtK(savedConfirmed(g))} confirmed savings and ${fmtK(interestEarned(g))} loan interest received so far this cycle.`;
  const comm=committee(g).map(m=>`<div class="row"><span><strong>${esc(m.name)}</strong>${m.id===vid?' <span class="muted">(you)</span>':''}</span><span class="meta">${ROLE[m.role]}</span></div>`).join('');

  return groupHead(g)+moneyCard(g)+`
  <section class="section"><h2>Needs attention</h2><div class="list">${att}</div></section>
  <section class="section"><h2>This month: ${esc(mLabel(g,cm))}</h2><p class="sub">${esc(totals)}</p>
    <div class="formcard" style="padding:16px">${month}</div><div class="list">${rows}</div>
    ${priv?privacyNote("You can see who has paid, but only the committee can see other members' amounts."):''}
    ${g.type==='village'?'<div class="form-actions"><button class="btn small ghost" data-action="go" data-screen="members">See all members</button></div>':''}</section>
  <section class="section"><h2>Committee</h2><p class="sub">The committee checks the records and approves any money leaving the group.</p><div class="list">${comm}</div></section>
  <section class="section"><h2>Group type</h2>
    <div class="typelock">${icon('lock')}<div><strong>${TYPE[g.type]}, locked</strong><p class="meta">Changing the type changes how everyone's money is worked out, so it needs committee approval.</p>
    ${typePending?'<p class="meta" style="margin-top:6px"><strong>A request to change the type is waiting for approval.</strong></p>':'<button class="linkbtn" data-action="ask-type">Ask to change the type</button>'}</div></div></section>`;
}

function entry(g,c,vid){
  const sup=c.supersededBy?g.contributions.find(x=>x.id===c.supersededBy):null;
  const orig=c.correctionOf?g.contributions.find(x=>x.id===c.correctionOf):null;
  const st=sup?'corrected':c.status;
  let notes='';
  if(c.status==='disputed'&&c.disputeNote)notes+=`<p class="note bad"><strong>${esc(first(g,c.memberId))} says:</strong> "${esc(c.disputeNote)}"</p>`;
  if(orig)notes+=`<p class="note info">This corrects the ${fmtK(orig.amount)} entry from ${fmtD(orig.time)}. Reason: "${esc(c.note)}"</p>`;
  if(sup)notes+=`<p class="note plain">Replaced by a correction on ${fmtD(c.supersededAt)}. It stays here so everyone can see what changed.</p>`;
  if(c.note&&!orig)notes+=`<p class="note plain">Note: ${esc(c.note)}</p>`;
  let acts='';
  if(!sup&&c.memberId===vid&&c.status==='waiting')acts+=`<button class="btn small" data-action="confirm" data-id="${c.id}">Yes, I paid this</button><button class="btn small danger-ghost" data-action="dispute" data-id="${c.id}">This is wrong</button>`;
  if(!sup&&isT(g))acts+=`<button class="btn small ghost" data-action="correct" data-id="${c.id}">Fix with a correction</button>`;
  return `<article class="entry${sup?' superseded':''}">
    <div class="entry-top"><div><strong>${esc(nm(g,c.memberId))}</strong>${c.memberId===vid?' <span class="muted">(you)</span>':''}<div class="meta">${esc(mLabel(g,c.month))}</div></div><div class="amt">${fmtK(c.amount)}</div></div>
    <p class="meta">${esc(M(c.method).label)}${c.ref?', ref '+esc(c.ref):''}. Recorded by ${esc(nm(g,c.recordedBy))} on ${fmtDT(c.time)}.</p>
    <div class="entry-status">${pill(st)}</div>${notes}${acts?`<div class="actions">${acts}</div>`:''}</article>`;
}

function payments(g){
  const vid=viewerId(g),priv=privateView(g);
  if(priv)S.payTab='mine';
  const sorted=[...g.contributions].sort((a,b)=>b.time-a.time);
  let list,top='';
  if(S.payTab==='mine'){
    list=sorted.filter(c=>c.memberId===vid);
    const w=list.filter(c=>c.status==='waiting'&&!c.supersededBy).length;
    if(w)top=`<div class="infobox">Before you confirm, check each payment against the message from your mobile money provider or your cash receipt.</div>`;
  }else{
    list=S.payMonth==='all'?sorted:sorted.filter(c=>c.month===+S.payMonth);
    const opts=['<option value="all">All months</option>'].concat(Array.from({length:g.currentMonth},(_,i)=>`<option value="${i+1}"${String(i+1)===String(S.payMonth)?' selected':''}>${esc(mLabel(g,i+1))}</option>`));
    top=`<div class="filter"><label for="pay-month">Show</label><select id="pay-month">${opts.join('')}</select></div>`;
    if(!isT(g))top+=`<p class="hint">Only the treasurer can record payments. You can confirm or dispute your own.</p>`;
  }
  const tabs=priv?privacyNote('In village banking, you see only your own payments. The committee sees everyone\'s, and the group totals are on the Overview.'):`<div class="tabs" role="tablist"><button role="tab" data-action="tab" data-tab="mine" aria-selected="${S.payTab==='mine'}">My payments</button><button role="tab" data-action="tab" data-tab="all" aria-selected="${S.payTab==='all'}">All payments</button></div>`;
  return groupHead(g)+`<div class="screen-head"><h2>Payments</h2>${isT(g)?'<button class="btn" data-action="go" data-screen="record">Record a payment</button>':''}</div>
  ${tabs}${top}<div class="list">${list.length?list.map(c=>entry(g,c,vid)).join(''):'<p class="empty">No payments to show.</p>'}</div>`;
}

function methodChips(name,selected){
  return `<div class="chips" role="radiogroup">${METHODS.map(m=>`<label class="chip"><input type="radio" name="${name}" value="${m.id}"${selected===m.id?' checked':''}><span>${m.label}</span></label>`).join('')}</div>`;
}
function refField(prefix,method){
  const m=method?M(method):null;
  const hide=m&&m.id==='cash';
  return `<div class="field" id="${prefix}-refwrap"${hide?' hidden':''}><label for="${prefix}-ref" id="${prefix}-reflabel">${m&&!m.needsRef?'Deposit slip number (optional)':'Transaction reference'}</label><input type="text" id="${prefix}-ref" autocomplete="off"><p class="hint" id="${prefix}-refhint">${m?esc(m.hint):'Needed for mobile money. It lets anyone trace the payment.'}</p></div>
  <p class="hint" id="${prefix}-cashhint"${hide?'':' hidden'}>For cash, write the member a receipt as well.</p>`;
}
function record(g){
  if(!isT(g))return groupHead(g)+`<p class="infobox">Only the treasurer can record payments.</p>`;
  const today=new Date();const iso=today.getFullYear()+'-'+p2(today.getMonth()+1)+'-'+p2(today.getDate());
  return backTo('payments','Payments')+`<h1 class="page-title">Record a payment</h1>
  <p class="lede">The member will be asked to confirm it. Once saved, a payment cannot be edited or deleted. Mistakes are fixed with a correction that the committee can see.</p>
  <div id="rec-errors"></div>
  <div class="formcard">
    <div class="field"><label for="f-member">Who paid?</label><select id="f-member"><option value="">Choose a member</option>${g.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div>
    <div class="field"><label for="f-amount">Amount (K)</label><input type="number" id="f-amount" inputmode="decimal" min="0" step="0.01" value="${g.type==='chilimba'?g.amount:''}">${g.type==='chilimba'?`<p class="hint">Everyone in this chilimba pays ${fmtK(g.amount)} a month.</p>`:`<p class="hint">The minimum saving is ${fmtK(g.amount)}. Loan repayments are recorded on the Loans screen.</p>`}</div>
    <div class="field"><label for="f-month">For which month?</label><select id="f-month">${Array.from({length:g.cycle},(_,i)=>`<option value="${i+1}"${i+1===g.currentMonth?' selected':''}>${esc(mLabel(g,i+1))}</option>`).join('')}</select></div>
    <div class="field"><label for="f-date">Date paid</label><input type="date" id="f-date" value="${iso}"></div>
    <div class="field"><span class="label">How did they pay?</span>${methodChips('f-method','')}</div>
    ${refField('f','')}
    <div class="field"><label for="f-note">Note (optional)</label><input type="text" id="f-note" placeholder="For example: paid at the meeting"></div>
    <div class="form-actions"><button class="btn" data-action="save-record">Save payment</button><button class="btn ghost" data-action="go" data-screen="payments">Cancel</button></div>
  </div>`;
}

function members(g){
  const cm=g.currentMonth,vid=viewerId(g),priv=privateView(g),comms=isComms(g);
  const notPaid=g.members.filter(mb=>monthStatus(g,mb.id,cm).status==='notpaid');
  const rows=g.members.map(mb=>{
    const s=monthStatus(g,mb.id,cm);
    const tot=savedBy(g,mb.id);
    const showAmt=!priv||mb.id===vid;
    let extra='';
    if(g.type==='chilimba'){const i=g.rotation.indexOf(mb.id);const po=g.outgoing.find(o=>o.kind==='payout'&&o.month===i+1&&o.status==='approved');extra=po?`, received the pot in Month ${i+1}`:`, receives the pot in Month ${i+1} (${monthLabel(g,i+1)})`}
    const remind=comms&&s.status==='notpaid'?`<button class="btn small ghost" data-action="remind" data-id="${mb.id}">Send reminder</button>`:'';
    return `<div class="row"><div><strong>${esc(mb.name)}</strong>${mb.id===vid?' <span class="muted">(you)</span>':''}${mb.role!=='member'?`<span class="role-tag">${ROLE[mb.role]}</span>`:''}<div class="meta">${esc(mb.phone)}${esc(extra)}</div></div>
    <div class="right">${showAmt?`<span class="num" style="font-weight:700">${fmtK(tot)}</span><span class="meta">${g.type==='village'?'saved':'paid'} this cycle</span>`:''}${pill(s.status,s.status==='notpaid'?'Not paid this month':null)}${remind}</div></div>`;
  }).join('');
  return groupHead(g)+`<div class="screen-head"><h2>Members</h2>${comms&&notPaid.length?`<button class="btn small" data-action="remind-all">Remind all ${notPaid.length} who have not paid</button>`:''}</div>
  <p class="sub muted" style="margin-top:4px">Up to ${MAXM[g.type]} members in a ${TYPE[g.type].toLowerCase()}. Status shows ${esc(mLabel(g,cm))}.</p>
  ${comms?'<p class="hint">As the communications person, you can send payment reminders.</p>':''}
  <div class="list">${rows}</div>${priv?privacyNote("You can see your own savings. Other members' savings are only visible to the committee."):''}`;
}

function turns(g){
  const pot=g.amount*g.members.length,cm=g.currentMonth;
  const rec=g.rotation[cm-1],next=g.rotation[cm];
  const conf=sum(g.members,mb=>monthStatus(g,mb.id,cm).confirmed);
  const tid=treasurerId(g);
  const items=g.rotation.map((id,i)=>{
    const m=i+1,po=g.outgoing.find(o=>o.kind==='payout'&&o.month===m&&o.status!=='rejected');
    let cls='',info;
    if(po&&po.status==='approved'){cls='done';info=pill('approved',`Received ${fmtK(po.amount)} on ${fmtD(po.decidedAt)}`)}
    else if(po){cls=m===cm?'now':'';info=pill('pending','Payout waiting for approval')}
    else if(m===cm){cls='now';info=`<span class="meta">This month. ${fmtK(conf)} of ${fmtK(pot)} confirmed so far.</span>`}
    else if(m<cm){info=pill('bad','Not paid out')}
    else info=`<span class="meta">Upcoming</span>`;
    return `<li class="${cls}"><span class="n">${m}</span><div><div class="rname">${esc(nm(g,id))}${id===viewerId(g)?' <span class="muted">(you)</span>':''}</div><div class="rinfo"><span class="meta">${esc(monthLabel(g,m))}</span>${info}</div></div></li>`;
  }).join('');
  const tLast=g.rotation[g.rotation.length-1]===tid;
  return groupHead(g)+`<section class="hero"><h2>This month the pot goes to</h2><p class="who-big">${esc(nm(g,rec))}</p>
    <p style="margin-top:8px">Everyone pays ${fmtK(g.amount)}, so the full pot is <strong>${fmtK(pot)}</strong>. ${fmtK(conf)} is confirmed so far.</p>
    ${next?`<p class="meta" style="margin-top:4px">Next: ${esc(nm(g,next))} in ${esc(monthLabel(g,cm+1))}.</p>`:''}
    ${isT(g)?'<div style="margin-top:12px"><button class="btn small" data-action="pay-receiver">Ask to pay this month\'s receiver</button></div>':''}</section>
  <section class="section"><h2>Order for receiving the pot</h2><p class="sub">Changing this order needs committee approval.</p><ol class="rot">${items}</ol>
  ${tLast?`<div class="infobox"><strong>Why the treasurer is last:</strong> ${esc(nm(g,tid))} receives the pot in the final month. Her own money stays in the group until everyone else has been paid, which makes running away with the money far less tempting.</div>`:''}</section>`;
}

function shareout(g){
  const T=savedConfirmed(g),inc=r2(sum(g.income,i=>i.amount)),intr=interestEarned(g);
  const spent=r2(sum(g.outgoing.filter(o=>o.kind==='withdrawal'&&o.status==='approved'),o=>o.amount));
  const P=r2(T+inc+intr-spent);
  const vid=viewerId(g),priv=privateView(g),lent=lentOut(g);
  const waitingAmt=priv?r2(sum(active(g).filter(c=>c.memberId===vid&&c.status!=='confirmed'),c=>c.amount)):r2(sum(active(g).filter(c=>c.status!=='confirmed'),c=>c.amount));
  const rows=g.members.map(mb=>{const s=savedBy(g,mb.id);return {mb,s,pct:T?s/T*100:0,get:T?r2(P*s/T):0}}).sort((a,b)=>b.s-a.s);
  const steps=(r,you)=>{const who=you?'You':first(g,r.mb.id);return `<ol class="steps">
    <li>${who} saved <strong>${fmtK(r.s)}</strong>. The whole group saved <strong>${fmtK(T)}</strong>.</li>
    <li>${you?'Your':who+"'s"} part of the savings is ${fmtK(r.s)} ÷ ${fmtK(T)}, which is about <strong>${r.pct.toFixed(1)}%</strong>.</li>
    <li>The group has <strong>${fmtK(P)}</strong> to share.</li>
    <li>So ${you?'you receive':who+' receives'} ${fmtK(r.s)} ÷ ${fmtK(T)} × ${fmtK(P)} = <strong>${fmtK(r.get)}</strong>.</li></ol>`};
  const me=rows.find(r=>r.mb.id===vid);
  const totalShares=r2(sum(rows,r=>r.get));
  const list=rows.map(r=>`<details class="share"><summary><span><strong>${esc(r.mb.name)}</strong>${r.mb.id===vid?' <span class="muted">(you)</span>':''}<span class="pct" style="display:block">Saved ${fmtK(r.s)}, ${r.pct.toFixed(1)}% of savings</span></span><span class="get">${fmtK(r.get)}<span class="open-hint" style="display:block">See the maths</span></span></summary><div class="body">${steps(r,r.mb.id===vid)}</div></details>`).join('');
  const everyone=priv?`<section class="section">${privacyNote("Only the committee can see everyone's share-out. You can always see yours, and the group totals above, so you can check that the money to share adds up.")}</section>`
    :`<section class="section"><h2>Everyone's share-out</h2><p class="sub">Visible to the committee only. Tap a name to see how the amount is worked out.</p><div class="list">${list}</div>
    <p class="meta" style="margin-top:10px">Check: all shares added together come to ${fmtK(totalShares)}${Math.abs(totalShares-P)>0.001?`, a difference of ${fmtK(Math.abs(totalShares-P))} from rounding to the ngwee`:', the same as the money to share'}.</p></section>`;
  return groupHead(g)+`<div class="screen-head"><h2>Share-out</h2></div>
  <p class="muted" style="margin-top:4px">The cycle ends in Month ${g.cycle} (${esc(monthLabel(g,g.cycle))}). These figures show what would be shared if the share-out happened today. Only confirmed savings and confirmed loan repayments are counted.</p>
  ${waitingAmt>0?`<div class="warnbox">${fmtK(waitingAmt)} of ${priv?'your':''} savings is still waiting for confirmation or disputed, so it is not counted yet.</div>`:''}
  <section class="section"><h2>Money to share</h2><ul class="calc">
    <li><span>Confirmed savings</span><span class="v">${fmtK(T)}</span></li>
    <li><span>Plus loan interest received</span><span class="v">+ ${fmtK(intr)}</span></li>
    <li><span>Plus fees and fines collected</span><span class="v">+ ${fmtK(inc)}</span></li>
    <li><span>Minus approved group spending</span><span class="v">− ${fmtK(spent)}</span></li>
    <li class="total"><span>Money to share</span><span class="v">${fmtK(P)}</span></li></ul>
    ${lent>0?`<p class="hint">${fmtK(lent)} is still lent out to members. All loans must be fully repaid before the share-out.</p>`:''}</section>
  ${me?`<section class="hero"><h2>Your share-out today</h2><p class="who-big">${fmtK(me.get)}</p>${steps(me,true)}</section>`:''}
  ${everyone}`;
}

function loanCard(g,l,vid){
  const c=lcalc(g,l),own=l.memberId===vid;
  let st;
  if(l.status==='requested')st=pill('pending','Waiting for committee approval');
  else if(l.status==='rejected')st=pill('rejected');
  else if(l.status==='approved')st=pill('tosend');
  else if(l.status==='repaid')st=pill('repaid');
  else st=c.overdue?pill('overdue',`Overdue since ${monthLabel(g,c.dueMonth)}`):pill('repaying');
  const due=c.dueMonth?`by the end of ${monthLabel(g,c.dueMonth)}`:`${plural(l.months,'month','months')} after it is sent`;
  const rps=l.repayments.slice().sort((a,b)=>a.time-b.time).map(r=>{
    const acts=own&&r.status==='waiting'?`<span class="actions" style="margin:0"><button class="btn small" data-action="rp-confirm" data-loan="${l.id}" data-id="${r.id}">Yes, I paid this</button><button class="btn small danger-ghost" data-action="rp-dispute" data-loan="${l.id}" data-id="${r.id}">This is wrong</button></span>`:'';
    return `<div class="rp"><span><strong class="num">${fmtK(r.amount)}</strong> <span class="meta">on ${fmtD(r.time)}, ${esc(M(r.method).label)}${r.ref?', ref '+esc(r.ref):''}</span></span>${pill(r.status)}${acts}</div>`}).join('');
  let acts='';
  if(isT(g)&&l.status==='approved')acts+=`<button class="btn small" data-action="loan-send" data-id="${l.id}">Send the money</button>`;
  if(isT(g)&&l.status==='active')acts+=`<button class="btn small" data-action="loan-repay" data-id="${l.id}">Record a repayment</button>`;
  if(own&&l.sentAt&&!l.receivedAt)acts+=`<button class="btn small" data-action="loan-received" data-id="${l.id}">Yes, I received ${fmtK(l.amount)}</button>`;
  return `<article class="loan"><div class="loan-top"><div><h3>${esc(nm(g,l.memberId))}${own?' <span class="muted" style="font-size:15px;font-weight:400">(you)</span>':''}</h3><p class="meta">"${esc(l.purpose)}", asked on ${fmtD(l.requestedAt)}</p></div>${st}</div>
    <ul class="calc">
      <li><span>Borrowed</span><span class="v">${fmtK(l.amount)}</span></li>
      <li><span>Interest (${g.loanRate}% a month × ${plural(l.months,'month','months')})</span><span class="v">+ ${fmtK(c.interest)}</span></li>
      <li class="total"><span>Total to repay</span><span class="v">${fmtK(c.total)}</span></li>
      <li><span>Each month</span><span class="v">${fmtK(c.monthly)}</span></li>
      ${l.sentAt?`<li><span>Repaid so far</span><span class="v">${fmtK(c.paid)}</span></li><li><span>Still to pay</span><span class="v">${fmtK(c.remaining)}</span></li>`:''}
    </ul>
    ${l.sentAt?`<div class="progress" role="img" aria-label="${Math.round(c.paid/c.total*100)}% repaid"><span style="width:${Math.min(100,c.paid/c.total*100)}%"></span></div>`:''}
    <p class="meta" style="margin-top:8px">${l.sentAt?`Sent on ${fmtD(l.sentAt)} (ref ${esc(l.sentRef)}). ${l.receivedAt?'Receipt confirmed by '+esc(first(g,l.memberId))+'.':'Not yet confirmed as received.'} `:''}Repay ${due}.</p>
    ${rps?`<div style="margin-top:8px">${rps}</div>`:''}
    ${acts?`<div class="actions">${acts}</div>`:''}</article>`;
}
function loans(g){
  const vid=viewerId(g),adm=isAdm(g),lent=lentOut(g);
  const activeLoans=g.loans.filter(l=>l.status==='active');
  const mine=g.loans.filter(l=>l.memberId===vid).sort((a,b)=>b.requestedAt-a.requestedAt);
  const order={approved:0,requested:1,active:2,repaid:3,rejected:4};
  const all=g.loans.slice().sort((a,b)=>(order[a.status]-order[b.status])||(lcalc(g,b).overdue-lcalc(g,a).overdue)||(b.requestedAt-a.requestedAt));
  const rules=`<div class="rules">
    <div class="rule-item"><strong>${g.loanRate}% a month</strong><span>Interest on the amount borrowed, for each month of the loan.</span></div>
    <div class="rule-item"><strong>${g.loanMultiple} × your savings</strong><span>The most you can borrow.</span></div>
    <div class="rule-item"><strong>Up to ${plural(g.loanMaxMonths,'month','months')}</strong><span>Time to repay. One loan at a time.</span></div></div>
    <p class="hint" style="margin-top:8px">Repayments pay off the interest first, then the amount borrowed. All interest goes to the group and is shared out at the end of the cycle, so borrowers also get a share of it. Changing these rules needs committee approval.</p>`;
  const summary=`<div class="formcard" style="padding:16px"><span class="big">${fmtK(lent)}</span> <span class="muted">lent out to ${plural(activeLoans.length,'member','members')} right now. ${fmtK(interestEarned(g))} interest received so far.</span></div>`;
  const body=adm
    ?`<section class="section"><h2>All loans</h2><p class="sub">Visible to the committee only.</p><div class="list">${all.length?all.map(l=>loanCard(g,l,vid)).join(''):'<p class="empty">No loans yet.</p>'}</div></section>`
    :`<section class="section"><h2>My loans</h2><div class="list">${mine.length?mine.map(l=>loanCard(g,l,vid)).join(''):'<p class="empty">You have not borrowed from the group yet.</p>'}</div>${privacyNote("Other members' loans are only visible to the committee. Everyone can see the total lent out.")}</section>`;
  return groupHead(g)+`<div class="screen-head"><h2>Loans</h2><button class="btn" data-action="go" data-screen="loanreq">Ask for a loan</button></div>
  ${summary}<section class="section"><h2>Group loan rules</h2>${rules}</section>${body}`;
}
function loanreq(g){
  const vid=viewerId(g),saved=savedBy(g,vid),limit=r2(saved*g.loanMultiple),h=holdings(g),avail=r2(h.bank+h.momo+h.cash);
  const open=openLoan(g,vid);
  const amt=Math.min(1000,limit)||'';
  const block=open?`<div class="warnbox"><strong>You already have a loan ${open.status==='active'?'being repaid':'waiting'}.</strong> The group allows one loan at a time, so you can ask again once it is fully repaid. You can still use the calculator below to see how a loan would work.</div>`:'';
  return backTo('loans','Loans')+`<h1 class="page-title">Ask for a loan</h1>
  <p class="lede">The committee will look at your request. The calculation below shows exactly what you would pay back.</p>
  <div id="ln-errors"></div>${block}
  <div class="infobox">Your confirmed savings are <strong>${fmtK(saved)}</strong>, so you can borrow up to <strong>${fmtK(limit)}</strong> (${g.loanMultiple} × your savings).</div>
  <div class="formcard">
    <div class="field"><label for="ln-amount">How much do you want to borrow? (K)</label><input type="number" id="ln-amount" inputmode="decimal" min="0" step="1" value="${amt}"></div>
    <div class="field"><label for="ln-months">How many months to repay?</label><select id="ln-months">${Array.from({length:g.loanMaxMonths},(_,i)=>`<option value="${i+1}"${i+1===2&&g.loanMaxMonths>=2?' selected':''}>${plural(i+1,'month','months')}</option>`).join('')}</select></div>
    <div class="calcbox" id="ln-calc" aria-live="polite">${loanCalcBox(g,amt,Math.min(2,g.loanMaxMonths))}</div>
    <div class="field"><label for="ln-purpose">What is the loan for?</label><input type="text" id="ln-purpose" placeholder="For example: buy stock for my shop"><p class="hint">The committee reads this before voting.</p></div>
    <div class="form-actions"><button class="btn" data-action="save-loan"${open?' disabled':''}>Send loan request</button><button class="btn ghost" data-action="go" data-screen="loans">Cancel</button></div>
    <p class="hint">The group has ${fmtK(avail)} available to lend right now.</p>
  </div>`;
}
function loanCalcBox(g,amount,months){
  const a=parseFloat(amount);
  if(!(a>0))return '<h3>How the loan works out</h3><p class="meta" style="margin-top:6px">Enter an amount to see the calculation.</p>';
  return `<h3>How the loan works out</h3>${loanSteps(g,r2(a),months,true)}<p class="meta">The interest goes to the group, and you get a share of it back at share-out.</p>`;
}

function approvals(g){
  const vid=viewerId(g),priv=privateView(g),adm=isAdm(g);
  const vis=g.outgoing.filter(o=>!priv||o.kind!=='loan'||o.subject===vid);
  const sorted=vis.slice().sort((a,b)=>b.createdAt-a.createdAt);
  const pend=sorted.filter(o=>o.status==='pending'),done=sorted.filter(o=>o.status!=='pending');
  const card=o=>{
    const src=o.sources?Object.keys(o.sources).filter(k=>o.sources[k]>0).map(k=>`${fmtK(o.sources[k])} from ${srcName(g,k)}`).join(', '):'';
    const vlist=o.approvals.map(a=>`<li><span class="v-yes" aria-hidden="true">✓</span><span>${esc(nm(g,a.id))} (${ROLE[mem(g,a.id).role]}) said yes, ${fmtDT(a.time)}</span></li>`).concat(o.rejections.map(r=>`<li><span class="v-no" aria-hidden="true">✕</span><span>${esc(nm(g,r.id))} (${ROLE[mem(g,r.id).role]}) said no${r.reason?': "'+esc(r.reason)+'"':''}</span></li>`)).join('');
    let extra='';
    if(o.kind==='loan'){
      const c=lcalc(g,g.loans.find(l=>l.id===o.loanId));
      extra=`<p class="meta">Reason: "${esc(o.reason)}". Interest ${fmtK(c.interest)}, total to repay ${fmtK(c.total)} (${fmtK(c.monthly)} a month).${adm?` ${esc(first(g,o.to))}'s savings: ${fmtK(savedBy(g,o.to))}, so the limit is ${fmtK(savedBy(g,o.to)*g.loanMultiple)}.`:''}</p>`;
    }
    let acts='';
    if(canVote(g,o,vid))acts=`<div class="actions"><button class="btn small" data-action="vote-yes" data-id="${o.id}">Approve</button><button class="btn small danger-ghost" data-action="vote-no" data-id="${o.id}">Reject</button></div>`;
    else if(o.status==='pending'&&o.requestedBy===vid)acts=`<p class="note plain">You asked for this, so the committee must approve it.</p>`;
    else if(o.status==='pending'&&adm)acts=`<p class="note plain">You have already voted.</p>`;
    return `<article class="req"><div class="req-top"><h3>${esc(o.title)}</h3>${pill(o.status)}</div>
      <p class="meta" style="margin-top:4px">Asked by ${esc(nm(g,o.requestedBy))} on ${fmtDT(o.createdAt)}.${o.kind==='typechange'&&o.reason?' Reason: "'+esc(o.reason)+'"':''}</p>
      ${extra}${src?`<p class="meta">Taken from: ${esc(src)}.</p>`:''}
      ${o.status==='pending'?`<p class="rule">${RULE_TEXT}</p>`:''}
      ${vlist?`<ul class="votes">${vlist}</ul>`:'<p class="meta" style="margin-top:8px">No votes yet.</p>'}${acts}</article>`;
  };
  return groupHead(g)+`<div class="screen-head"><h2>Approvals</h2>${isT(g)?'<button class="btn" data-action="go" data-screen="request">Ask to pay out money</button>':''}</div>
  <p class="muted" style="margin-top:4px">Money only leaves the group after 2 committee members say yes, including the chairperson or vice chairperson. ${adm?'':'Ordinary members can see every decision, but only the committee votes.'}</p>
  ${priv?privacyNote("Loan requests from other members are private to the committee."):''}
  <section class="section"><h2>Waiting for approval</h2><div class="list">${pend.length?pend.map(card).join(''):'<p class="empty">Nothing is waiting for approval.</p>'}</div></section>
  <section class="section"><h2>Decided</h2><div class="list">${done.length?done.map(card).join(''):'<p class="empty">No decisions yet.</p>'}</div></section>`;
}

function fillSources(amount,h,order){
  const out={bank:0,momo:0,cash:0};let left=r2(amount);
  order.forEach(k=>{const t=Math.min(left,Math.max(0,h[k]));out[k]=r2(t);left=r2(left-t)});
  return out;
}
function request(g){
  if(!isT(g))return groupHead(g)+`<p class="infobox">Only the treasurer can ask to pay out money.</p>`;
  const kinds=g.type==='chilimba'?[['payout',"Pay this month's receiver"],['withdrawal','Other group spending']]:[['withdrawal','Group spending']];
  if(!kinds.some(k=>k[0]===S.reqKind))S.reqKind=kinds[0][0];
  const h=holdings(g),cm=g.currentMonth;
  let top='',amount='';
  if(S.reqKind==='payout'){
    const rec=g.rotation[cm-1],pot=g.amount*g.members.length;
    const ex=g.outgoing.find(o=>o.kind==='payout'&&o.month===cm&&o.status!=='rejected');
    const notConf=g.members.filter(mb=>monthStatus(g,mb.id,cm).status!=='confirmed');
    top=`<div class="infobox">This month's receiver is <strong>${esc(nm(g,rec))}</strong>. The full pot is ${fmtK(pot)}.</div>`;
    if(ex)top+=`<div class="errors">A payout for ${esc(mLabel(g,cm))} has already been ${ex.status==='pending'?'requested and is waiting for approval':'approved'}.</div>`;
    if(notConf.length)top+=`<div class="warnbox"><strong>${plural(notConf.length,'payment is','payments are')} not confirmed yet for this month:</strong> ${esc(notConf.map(m=>m.name).join(', '))}. You can still ask, but the committee may want to wait.</div>`;
    amount=Math.min(pot,h.bank+h.momo+h.cash);
  }
  const src=amount?fillSources(amount,h,['momo','cash','bank']):{bank:0,momo:0,cash:0};
  return backTo('approvals','Approvals')+`<h1 class="page-title">Ask to pay out money</h1>
  <p class="lede">Your request goes to the committee. The money is only counted as paid out once it is approved.</p>
  <div id="req-errors"></div>${top}
  <div class="formcard">
    <div class="field"><span class="label">What is the money for?</span><div class="chips" role="radiogroup">${kinds.map(([k,l])=>`<label class="chip"><input type="radio" name="r-kind" value="${k}"${S.reqKind===k?' checked':''}><span>${l}</span></label>`).join('')}</div></div>
    ${S.reqKind==='withdrawal'?`<div class="field"><label for="r-reason">Reason</label><input type="text" id="r-reason" placeholder="For example: bank account charge"><p class="hint">Be specific. The committee will read this before voting.</p></div>`:''}
    <div class="field"><label for="r-amount">Amount (K)</label><input type="number" id="r-amount" inputmode="decimal" min="0" step="0.01" value="${amount||''}"></div>
    <div class="field"><span class="label">Take the money from</span><p class="hint" style="margin:0 0 6px">Filled in for you. You can change the amounts.</p>
      ${['momo','cash','bank'].map(k=>`<div class="srcrow"><label for="src-${k}" style="font-weight:400">${esc(locName(g,k))}<span class="meta" style="display:block">Available: ${fmtK(h[k])}</span></label><input type="number" id="src-${k}" inputmode="decimal" min="0" step="0.01" value="${src[k]||''}"></div>`).join('')}
    </div>
    <div class="form-actions"><button class="btn" data-action="save-request">Send for approval</button><button class="btn ghost" data-action="go" data-screen="approvals">Cancel</button></div>
  </div>`;
}

function move(g){
  if(!isT(g))return groupHead(g)+`<p class="infobox">Only the treasurer can record money moved to the bank.</p>`;
  const h=holdings(g);
  return backTo('overview','Overview')+`<h1 class="page-title">Move money to the bank</h1>
  <p class="lede">Putting money into the group bank account makes it safer, so it does not need approval. It is still recorded in the history.</p>
  <div id="mv-errors"></div>
  <div class="formcard">
    <div class="field"><span class="label">Move from</span><div class="chips" role="radiogroup">
      <label class="chip"><input type="radio" name="mv-from" value="momo" checked><span>Mobile money (${fmtK(h.momo)})</span></label>
      <label class="chip"><input type="radio" name="mv-from" value="cash"><span>Cash (${fmtK(h.cash)})</span></label></div></div>
    <div class="field"><label for="mv-amount">Amount (K)</label><input type="number" id="mv-amount" inputmode="decimal" min="0" step="0.01" value="${h.momo>0?h.momo:''}"></div>
    <div class="field"><label for="mv-ref">Deposit slip or transaction number</label><input type="text" id="mv-ref" autocomplete="off"><p class="hint">This lets the committee check the deposit with the bank.</p></div>
    <div class="form-actions"><button class="btn" data-action="save-move">Record the deposit</button><button class="btn ghost" data-action="go" data-screen="overview">Cancel</button></div>
  </div>`;
}

function history(g){
  const all=g.history.filter(h=>histVisible(g,h)).sort((a,b)=>b.time-a.time);
  const show=all.slice(0,S.histLimit);
  const rows=show.map(h=>{const m=h.actor?mem(g,h.actor):null;return `<div class="hentry"><span class="when">${fmtDT(h.time)}</span><span class="who-line">${esc(h.actor?nm(g,h.actor):'Usambazi (automatic)')}${m&&m.role!=='member'?`<span class="role-tag">${ROLE[m.role]}</span>`:''}</span><span>${esc(h.text)}</span></div>`}).join('');
  return groupHead(g)+`<div class="screen-head"><h2>History</h2></div>
  <p class="muted" style="margin-top:4px">Every action in this group, newest first. Nobody can edit or remove anything here, not even the treasurer or chairperson.</p>
  ${privateView(g)?privacyNote("You see group-wide actions and everything about your own money. Entries about other members' money are visible to the committee only."):''}
  <div class="list">${rows}</div>
  ${all.length>show.length?`<div class="form-actions"><button class="btn ghost" data-action="more-hist">Show older entries (${all.length-show.length} more)</button></div>`:''}`;
}

  <div id="cg-errors"></div>
  <div class="formcard">

    <div class="field"><span class="label">Type of group</span><div class="typecards" role="radiogroup">
      <label class="typecard"><input type="radio" name="cg-type" value="chilimba"${ch?' checked':''}><span class="tc"><strong>Chilimba</strong><span>Everyone pays the same amount every month. Each month, one member receives the whole pot, in turn. Up to 20 members.</span></span></label>
      <label class="typecard"><input type="radio" name="cg-type" value="village"${!ch?' checked':''}><span class="tc"><strong>Village Banking</strong><span>Members save different amounts and can take loans. At the end of the cycle, money is shared out by how much each person saved. Up to 35 members.</span></span></label></div></div>
    <div class="field"><label for="cg-amount">${ch?'Amount each member pays every month (K)':'Minimum saving each month (K)'}</label><input type="number" id="cg-amount" inputmode="decimal" min="0" value="${esc(d.amount)}"></div>
    ${ch?'<p class="hint">In a chilimba, the cycle is one month per member, so it is set for you.</p>':`<div class="field"><label for="cg-cycle">Cycle length (months)</label><input type="number" id="cg-cycle" inputmode="numeric" min="1" max="24" value="${esc(d.cycle)}"><p class="hint">The share-out happens at the end of the cycle.</p></div>
    <div class="field"><label for="cg-rate">Loan interest (% per month)</label><input type="number" id="cg-rate" inputmode="decimal" min="0" max="50" value="${esc(d.rate)}"><p class="hint">Charged on the amount borrowed, for each month of the loan.</p></div>
    <div class="field"><label for="cg-mult">Members can borrow up to this many times their savings</label><input type="number" id="cg-mult" inputmode="numeric" min="1" max="10" value="${esc(d.mult)}"></div>
    <div class="field"><label for="cg-maxm">Longest time to repay a loan (months)</label><input type="number" id="cg-maxm" inputmode="numeric" min="1" max="12" value="${esc(d.maxm)}"></div>`}
    <div class="field"><label for="cg-start">First month</label><select id="cg-start">${startOpts}</select></div>
    <div class="field"><span class="label">Members and roles (${d.members.length} of up to ${max})</span><p class="hint" style="margin:0 0 4px">You need at least ${MINM} members. The committee must have at least ${MIN_COMMITTEE} people, including one chairperson and one treasurer. Suggested committee: chairperson, vice chairperson, treasurer, communications, and a member representative.${ch?' Members receive the pot in this order, but Usambazi always puts the treasurer last.':''}</p>${rowsHtml}
      <button class="btn small ghost" data-action="cg-add" style="margin-top:8px"${atMax?' disabled':''}>Add another member</button>${atMax?`<p class="hint">A ${TYPE[d.type].toLowerCase()} can have up to ${max} members.</p>`:''}</div>
    <div class="form-actions"><button class="btn" data-action="save-group">Create group</button><button class="btn ghost" data-action="home">Cancel</button></div>

const SCREENS=['overview','payments','record','members','cycle','approvals','request','move','history','loans','loanreq'];
function screen(g){
  if(!g)return S.screen==='create'?createScreen():home();
  switch(S.screen){
    case 'payments':return payments(g);
    case 'record':return record(g);
    case 'members':return members(g);
    case 'cycle':return g.type==='chilimba'?turns(g):shareout(g);
    case 'approvals':return approvals(g);
    case 'request':return request(g);
    case 'move':return move(g);
    case 'history':return history(g);
    case 'loans':return g.type==='village'?loans(g):overview(g);
    case 'loanreq':return g.type==='village'?loanreq(g):overview(g);
    default:return overview(g);
  }
}

/* ---------- Rendering ---------- */
const app=document.getElementById('app');
function render(keepScroll,focusMain){
  const y=window.scrollY,g=cur();
  if(g&&!SCREENS.includes(S.screen))S.screen='overview';
  if(!g&&!['home','create'].includes(S.screen))S.screen='home';
  app.innerHTML=topbar(g)+`<div class="layout${g?' has-nav':''}">${g?nav(g):''}<main class="content" id="main" tabindex="-1">${screen(g)}</main></div>`;
  window.scrollTo(0,keepScroll?y:0);
  if(focusMain){const m=document.getElementById('main');m&&m.focus({preventScroll:true})}
}
const go=()=>render(false,true);

let toastTimer;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},3400)}
function showErrors(id,list){
  const el=document.getElementById(id);if(!el)return;
  el.innerHTML=list.length?`<div class="errors">Please fix ${list.length===1?'this':'these'} first:<ul>${list.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`:'';
  if(list.length&&el.scrollIntoView)el.scrollIntoView({block:'center'});
}
const val=id=>{const e=document.getElementById(id);return e?e.value:''};
const radio=n=>{const e=document.querySelector(`input[name="${n}"]:checked`);return e?e.value:''};
const mark=(id,bad)=>{const e=document.getElementById(id);if(e)e.setAttribute('aria-invalid',bad?'true':'false')};
function refUsed(ref,exceptId){
  const r=normRef(ref);if(!r)return false;
  return S.groups.some(g=>g.contributions.some(c=>c.id!==exceptId&&normRef(c.ref)===r)||g.loans.some(l=>l.repayments.some(x=>x.id!==exceptId&&normRef(x.ref)===r)));
}

/* ---------- Modal ---------- */
const mroot=document.getElementById('modal-root');
let lastFocus=null;
function openModal(title,body,saveLabel,onSave,danger){
  lastFocus=document.activeElement;S.modalSave=onSave;
  mroot.innerHTML=`<div class="overlay" data-action="modal-bg"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">${title}</h2>${body}<div id="m-err"></div><div class="dialog-actions"><button class="btn ghost" data-action="modal-close">Cancel</button><button class="btn${danger?' danger':''}" data-action="modal-save">${saveLabel}</button></div></div></div>`;
  const f=mroot.querySelector('input:not([type=radio]),textarea,select');(f||mroot.querySelector('.btn')).focus();
}
function closeModal(){mroot.innerHTML='';S.modalSave=null;if(lastFocus&&document.body.contains(lastFocus))lastFocus.focus()}

/* ---------- Handlers ---------- */
function saveRecord(g){
  const errs=[];
  const mid=val('f-member'),amount=parseFloat(val('f-amount')),month=+val('f-month'),method=radio('f-method'),ref=val('f-ref').trim(),date=val('f-date'),note=val('f-note').trim();
  mark('f-member',!mid);if(!mid)errs.push('Choose who paid.');
  const okAmt=amount>0;mark('f-amount',!okAmt);if(!okAmt)errs.push('Enter the amount paid, for example 500.');
  if(!method)errs.push('Choose how they paid.');
  const m=method?M(method):null;
  if(m&&m.needsRef){const bad=ref.length<6;mark('f-ref',bad);if(bad)errs.push('Enter the transaction reference from the mobile money message. It lets anyone trace the payment.')}
  if(m&&m.id!=='cash'&&ref&&refUsed(ref)){mark('f-ref',true);errs.push('This reference number is already used for another payment. Each mobile money payment has its own reference.')}
  if(!date)errs.push('Choose the date the money was paid.');
  if(mid&&okAmt&&g.type==='chilimba'){const already=monthStatus(g,mid,month).amount;if(already+amount>g.amount)errs.push(`${nm(g,mid)} already has ${fmtK(already)} recorded for Month ${month}. If an entry is wrong, fix it with a correction instead.`)}
  showErrors('rec-errors',errs);if(errs.length)return;
  const now=new Date();const [yy,mo,dd]=date.split('-').map(Number);
  const t=new Date(yy,mo-1,dd,now.getHours(),now.getMinutes());
  addContrib(g,{memberId:mid,amount:r2(amount),month,method,ref:m.id==='cash'?'':ref,time:t,recordedBy:treasurerId(g),note});
  S.payTab='all';S.payMonth='all';S.screen='payments';go();
  toast(`Payment saved. ${first(g,mid)} will be asked to confirm it.`);
}
function disputeModal(title,meta,onSave){
  openModal(title,`<p class="meta">${meta}</p>
  <div class="field"><label for="m-reason">Explain what is wrong</label><textarea id="m-reason" placeholder="For example: I sent K500, not K300. My message shows K500."></textarea><p class="hint">The committee will see this until it is fixed.</p></div>`,'Mark as wrong',()=>{
    const r=val('m-reason').trim();if(r.length<5)return 'Please explain what is wrong in a few words.';
    onSave(r);
  },true);
}
function openCorrection(g,c){
  openModal('Fix with a correction',`<p class="meta">The original ${fmtK(c.amount)} entry stays visible. Your correction is added as a new entry, and ${esc(first(g,c.memberId))} will be asked to confirm it.</p>
  ${c.disputeNote?`<p class="note bad"><strong>${esc(first(g,c.memberId))} said:</strong> "${esc(c.disputeNote)}"</p>`:''}
  <div class="field"><label for="m-amount">Correct amount (K)</label><input type="number" id="m-amount" inputmode="decimal" min="0" step="0.01" value="${c.amount}"></div>
  <div class="field"><span class="label">How did they pay?</span>${methodChips('m-method',c.method)}</div>
  ${refField('m',c.method)}
  <div class="field"><label for="m-reason">Reason for the correction</label><textarea id="m-reason" placeholder="For example: I typed K300 by mistake. The Airtel message shows K500."></textarea></div>`,'Save correction',()=>{
    const amount=parseFloat(val('m-amount')),method=radio('m-method'),ref=val('m-ref').trim(),reason=val('m-reason').trim();
    if(!(amount>0))return 'Enter the correct amount.';
    if(!method)return 'Choose how they paid.';
    if(M(method).needsRef&&ref.length<6)return 'Enter the transaction reference from the mobile money message.';
    if(M(method).id!=='cash'&&ref&&normRef(ref)!==normRef(c.ref)&&refUsed(ref,c.id))return 'This reference number is already used for another payment.';
    if(reason.length<5)return 'Explain why you are making this correction. The committee will read it.';
    addCorrection(g,c,{amount:r2(amount),method,ref:M(method).id==='cash'?'':ref,reason});
    render(true);toast(`Correction saved. ${first(g,c.memberId)} will be asked to confirm it.`);
  });
  const r=document.getElementById('m-ref');if(r)r.value=c.ref||'';
}
function openReject(g,o){
  openModal('Reject this request?',`<p>${esc(o.title)}</p><div class="field"><label for="m-reason">Reason (optional)</label><textarea id="m-reason" placeholder="For example: this is not allowed by our group rules"></textarea></div>`,'Reject request',()=>{
    vote(g,o,viewerId(g),'no',new Date(),val('m-reason').trim());render(true);toast(o.status==='rejected'?'Request rejected. No money was moved.':'Your no vote is recorded.');
  },true);
}
function askType(g){
  const nt=g.type==='chilimba'?'village':'chilimba';
  openModal('Ask to change the group type',`<p>The group is a <strong>${TYPE[g.type]}</strong>. You are asking to change it to <strong>${TYPE[nt]}</strong>. This needs committee approval, and it would start with the next cycle so that no one's current money is affected.</p>
  <div class="field"><label for="m-reason">Why do you want to change it?</label><textarea id="m-reason"></textarea></div>`,'Send for approval',()=>{
    const r=val('m-reason').trim();if(r.length<5)return 'Please give a reason. The committee will read it before voting.';
    addOut(g,{kind:'typechange',newType:nt,reason:r,requestedBy:viewerId(g),time:new Date()});render(true);toast('Request sent. The committee can vote on it in Approvals.');
  });
}
function saveRequest(g){
  const errs=[],h=holdings(g),kind=S.reqKind,cm=g.currentMonth;
  const amount=parseFloat(val('r-amount'));const reason=kind==='withdrawal'?val('r-reason').trim():'';
  if(!(amount>0)){errs.push('Enter the amount.');mark('r-amount',true)}
  if(kind==='withdrawal'&&reason.length<4){errs.push('Give a clear reason for the spending.');mark('r-reason',true)}
  if(kind==='payout'&&g.outgoing.some(o=>o.kind==='payout'&&o.month===cm&&o.status!=='rejected'))errs.push(`A payout for Month ${cm} already exists.`);
  const src={};let tot=0;
  ['momo','cash','bank'].forEach(k=>{const v=parseFloat(val('src-'+k))||0;src[k]=r2(v);tot+=v;if(v<0)errs.push('Amounts cannot be negative.');if(v>h[k]+0.001){errs.push(`Only ${fmtK(h[k])} is in ${srcName(g,k)}.`);mark('src-'+k,true)}});
  tot=r2(tot);
  if(amount>0&&Math.abs(tot-amount)>0.001)errs.push(`The amounts you are taking add up to ${fmtK(tot)}, but the request is for ${fmtK(amount)}. They must match.`);
  showErrors('req-errors',errs);if(errs.length)return;
  addOut(g,{kind,month:kind==='payout'?cm:undefined,to:kind==='payout'?g.rotation[cm-1]:undefined,amount:r2(amount),sources:src,reason,requestedBy:treasurerId(g),time:new Date()});
  S.screen='approvals';go();toast('Request sent. It needs 2 committee members to say yes.');
}
function saveMove(g){
  const errs=[],h=holdings(g);const from=radio('mv-from'),amount=parseFloat(val('mv-amount')),ref=val('mv-ref').trim();
  if(!(amount>0)){errs.push('Enter the amount moved.');mark('mv-amount',true)}
  else if(amount>h[from]+0.001){errs.push(`Only ${fmtK(h[from])} is held as ${from==='momo'?'mobile money':'cash'}.`);mark('mv-amount',true)}
  if(ref.length<3){errs.push('Enter the deposit slip or transaction number so the committee can check it.');mark('mv-ref',true)}
  showErrors('mv-errors',errs);if(errs.length)return;
  const tid=treasurerId(g),t=new Date();
  g.transfers.push({id:nid('t'),from,to:'bank',amount:r2(amount),time:t,by:tid,ref});
  hist(g,tid,`Moved ${fmtK(amount)} from ${from==='momo'?'mobile money':'cash'} to the group bank account. Deposit reference: ${ref}.`,t);
  S.screen='overview';go();toast('Deposit recorded. The money is now shown in the group bank account.');
}
function saveLoan(g){
  const vid=viewerId(g),errs=[],saved=savedBy(g,vid),limit=r2(saved*g.loanMultiple),h=holdings(g),avail=r2(h.bank+h.momo+h.cash);
  const amount=parseFloat(val('ln-amount')),months=+val('ln-months'),purpose=val('ln-purpose').trim();
  if(openLoan(g,vid))errs.push('You already have a loan. You can ask again once it is fully repaid.');
  if(!(amount>0)){errs.push('Enter how much you want to borrow.');mark('ln-amount',true)}
  else if(amount>limit+0.001){errs.push(`The most you can borrow is ${fmtK(limit)} (${g.loanMultiple} × your savings of ${fmtK(saved)}).`);mark('ln-amount',true)}
  else if(amount>avail+0.001){errs.push(`The group only has ${fmtK(avail)} available to lend right now.`);mark('ln-amount',true)}
  if(purpose.length<4){errs.push('Say what the loan is for. The committee reads this before voting.');mark('ln-purpose',true)}
  showErrors('ln-errors',errs);if(errs.length)return;
  requestLoan(g,vid,r2(amount),months,purpose,new Date());
  S.screen='loans';go();toast('Loan request sent to the committee.');
}
function openSend(g,l){
  const h=holdings(g);
  const firstOk=['bank','momo','cash'].find(k=>h[k]>=l.amount)||'bank';
  openModal(`Send ${fmtK(l.amount)} to ${esc(nm(g,l.memberId))}`,`<p class="meta">The loan is approved. Record where the money came from, so the committee can trace it. ${esc(first(g,l.memberId))} will be asked to confirm receiving it.</p>
  <div class="field"><span class="label">Send from</span><div class="chips" role="radiogroup">${['bank','momo','cash'].map(k=>`<label class="chip"><input type="radio" name="sd-from" value="${k}"${k===firstOk?' checked':''}><span>${esc(locName(g,k))} (${fmtK(h[k])})</span></label>`).join('')}</div></div>
  <div class="field"><label for="sd-ref">Transaction or withdrawal slip number</label><input type="text" id="sd-ref" autocomplete="off"></div>`,'Record as sent',()=>{
    const src=radio('sd-from'),ref=val('sd-ref').trim();
    if(h[src]<l.amount-0.001)return `Only ${fmtK(h[src])} is in ${srcName(g,src)}. Choose another place.`;
    if(ref.length<3)return 'Enter the transaction or slip number.';
    sendLoan(g,l,src,ref,new Date(),g.currentMonth);render(true);toast(`Loan recorded as sent. ${first(g,l.memberId)} will be asked to confirm.`);
  });
}
function openRepay(g,l){
  const c=lcalc(g,l),mem_=mem(g,l.memberId);
  const lastMethod=(l.repayments[l.repayments.length-1]||{}).method||'';
  openModal(`Record a repayment from ${esc(mem_.name)}`,`<p class="meta">Still to pay: ${fmtK(c.remaining)}. The monthly amount is ${fmtK(c.monthly)}.</p>
  <div class="field"><label for="m-amount">Amount repaid (K)</label><input type="number" id="m-amount" inputmode="decimal" min="0" step="0.01" value="${Math.min(c.monthly,c.remaining)}"></div>
  <div class="field"><span class="label">How did they pay?</span>${methodChips('m-method',lastMethod)}</div>
  ${refField('m',lastMethod)}`,'Save repayment',()=>{
    const amount=parseFloat(val('m-amount')),method=radio('m-method'),ref=val('m-ref').trim();
    if(!(amount>0))return 'Enter the amount repaid.';
    if(amount>c.remaining+0.001)return `That is more than the ${fmtK(c.remaining)} still to pay.`;
    if(!method)return 'Choose how they paid.';
    if(M(method).needsRef&&ref.length<6)return 'Enter the transaction reference from the mobile money message.';
    if(M(method).id!=='cash'&&ref&&refUsed(ref))return 'This reference number is already used for another payment.';
    addRepay(g,l,{amount:r2(amount),method,ref:M(method).id==='cash'?'':ref,time:new Date(),month:g.currentMonth});
    render(true);toast(l.status==='repaid'?'Repayment saved. The loan is now fully repaid.':`Repayment saved. ${first(g,l.memberId)} will be asked to confirm it.`);
  });
}
function syncDraft(){
  const d=S.draft;if(!d||!document.getElementById('cg-name'))return;
  d.name=val('cg-name');d.amount=val('cg-amount');d.start=val('cg-start');
  if(document.getElementById('cg-cycle')){d.cycle=val('cg-cycle');d.rate=val('cg-rate');d.mult=val('cg-mult');d.maxm=val('cg-maxm')}
  d.members.forEach((m,i)=>{m.name=val('cm-name-'+i);m.phone=val('cm-phone-'+i);m.role=val('cm-role-'+i)});
}
function saveGroup(){
  syncDraft();const d=S.draft,errs=[];
  const name=d.name.trim(),amount=parseFloat(d.amount),ms=d.members.filter(m=>m.name.trim()),max=MAXM[d.type];
  if(!name){errs.push('Give the group a name.');mark('cg-name',true)}
  if(!(amount>0)){errs.push('Enter the monthly amount.');mark('cg-amount',true)}
  if(ms.length<MINM)errs.push(`Add at least ${MINM} members.`);
  if(ms.length>max)errs.push(`A ${TYPE[d.type].toLowerCase()} can have up to ${max} members. You have ${ms.length}.`);
  const count=r=>ms.filter(m=>m.role===r).length;
  if(count('chair')!==1)errs.push('Choose exactly one chairperson.');
  if(count('treasurer')!==1)errs.push('Choose exactly one treasurer.');
  if(count('vice')>1)errs.push('Choose only one vice chairperson.');
  const comm=ms.filter(m=>m.role!=='member').length;
  if(comm<MIN_COMMITTEE)errs.push(`The committee needs at least ${MIN_COMMITTEE} people. You have ${comm}.`);
  if(count('member')<1)errs.push('Add at least one ordinary member.');
  const cyc=d.type==='chilimba'?ms.length:parseInt(d.cycle,10);
  let rate=10,mult=3,maxm=3;
  if(d.type==='village'){
    if(!(cyc>=1&&cyc<=24)){errs.push('The cycle must be between 1 and 24 months.');mark('cg-cycle',true)}
    rate=parseFloat(d.rate);mult=parseFloat(d.mult);maxm=parseInt(d.maxm,10);
    if(!(rate>=0&&rate<=50)){errs.push('Loan interest must be between 0% and 50% a month.');mark('cg-rate',true)}
    if(!(mult>=1&&mult<=10)){errs.push('The borrowing limit must be between 1 and 10 times savings.');mark('cg-mult',true)}
    if(!(maxm>=1&&maxm<=12)){errs.push('The longest repayment time must be between 1 and 12 months.');mark('cg-maxm',true)}
  }
  showErrors('cg-errors',errs);if(errs.length)return;
  const now=new Date(),st=new Date(now.getFullYear(),now.getMonth()+(+d.start||0),1);
  const g=blankGroup({id:nid('g'),name,type:d.type,amount:r2(amount),cycle:cyc,currentMonth:1,startY:st.getFullYear(),startM:st.getMonth(),loanRate:rate,loanMultiple:mult,loanMaxMonths:maxm});
  g.members=ms.map(m=>({id:nid('m'),name:m.name.trim(),phone:m.phone.trim()||'No phone given',role:m.role}));
  const tid=treasurerId(g);
  g.rotation=g.members.map(m=>m.id).filter(id=>id!==tid).concat([tid]);
  g.memberView=byRole(g,'member').id;
  const chair=byRole(g,'chair').id;
  hist(g,chair,`Created the group as ${d.type==='chilimba'?'a Chilimba':'Village Banking'}: ${g.members.length} members, ${d.type==='chilimba'?fmtK(amount)+' each per month':'at least '+fmtK(amount)+' saved each month'}, ${cyc}-month cycle.${d.type==='village'?` Loans: ${rate}% interest a month, up to ${mult} times savings, repaid within ${plural(maxm,'month','months')}.`:''}`,now);
  hist(g,chair,`Set up a committee of ${comm}: ${committee(g).map(m=>m.name+' ('+ROLE[m.role]+')').join(', ')}.`,now);
  if(d.type==='chilimba')hist(g,chair,`Set the order for receiving the pot. The treasurer, ${nm(g,tid)}, receives last.`,now);
  S.groups.unshift(g);S.gid=g.id;S.screen='overview';S.draft=null;go();toast(`${name} is ready. Records start from ${monthLabel(g,1)}.`);
}
function newDraft(){return {name:'',type:'chilimba',amount:'500',cycle:'12',rate:'10',mult:'3',maxm:'3',start:'0',members:['chair','vice','treasurer','comms','rep','member','member'].map(role=>({name:'',phone:'',role}))}}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b)return;
  const a=b.dataset.action,g=cur(),id=b.dataset.id;
  switch(a){
    case 'home':S.gid=null;S.screen='home';closeModal();go();break;
    case 'open':S.gid=id;S.screen='overview';S.payTab='mine';S.payMonth='all';S.histLimit=40;go();break;
    case 'go':S.screen=b.dataset.screen;if(b.dataset.tab)S.payTab=b.dataset.tab;if(S.screen==='request')S.reqKind=null;go();break;
    case 'tab':S.payTab=b.dataset.tab;render(true);break;
    case 'confirm':{const c=g.contributions.find(x=>x.id===id);confirmC(g,c);render(true);toast('Thank you. The payment is confirmed.');break;}
    case 'dispute':{const c=g.contributions.find(x=>x.id===id);disputeModal('What is wrong with this payment?',`${fmtK(c.amount)} for ${esc(mLabel(g,c.month))}, recorded by ${esc(nm(g,c.recordedBy))}.`,r=>{disputeC(g,c,r);render(true);toast('Marked as disputed. The committee can now see it.')});break;}
    case 'correct':openCorrection(g,g.contributions.find(x=>x.id===id));break;
    case 'save-record':saveRecord(g);break;
    case 'vote-yes':{const o=g.outgoing.find(x=>x.id===id);vote(g,o,viewerId(g),'yes');render(true);toast(o.status==='approved'?'Approved. The request now has enough yes votes.':'Your yes vote is recorded. It still needs more approval.');break;}
    case 'vote-no':openReject(g,g.outgoing.find(x=>x.id===id));break;
    case 'pay-receiver':S.screen='request';S.reqKind='payout';go();break;
    case 'save-request':saveRequest(g);break;
    case 'save-move':saveMove(g);break;
    case 'save-loan':saveLoan(g);break;
    case 'loan-send':openSend(g,g.loans.find(l=>l.id===id));break;
    case 'loan-repay':openRepay(g,g.loans.find(l=>l.id===id));break;
    case 'loan-received':{const l=g.loans.find(x=>x.id===id);confirmLoanReceived(g,l);render(true);toast('Thank you. Receipt of the loan is confirmed.');break;}
    case 'rp-confirm':{const l=g.loans.find(x=>x.id===b.dataset.loan);confirmRepay(g,l,l.repayments.find(r=>r.id===id));render(true);toast('Thank you. The repayment is confirmed.');break;}
    case 'rp-dispute':{const l=g.loans.find(x=>x.id===b.dataset.loan),r=l.repayments.find(x=>x.id===id);disputeModal('What is wrong with this repayment?',`${fmtK(r.amount)} recorded on ${fmtD(r.time)}.`,reason=>{disputeRepay(g,l,r,reason);render(true);toast('Marked as disputed. The committee can now see it.')});break;}
    case 'remind':{hist(g,viewerId(g),`Sent a payment reminder to ${nm(g,id)} for ${mLabel(g,g.currentMonth)}.`,new Date());render(true);toast(`Reminder recorded for ${first(g,id)}. In the real app this would go by SMS or WhatsApp.`);break;}
    case 'remind-all':{const np=g.members.filter(mb=>monthStatus(g,mb.id,g.currentMonth).status==='notpaid');hist(g,viewerId(g),`Sent payment reminders to ${np.map(m=>m.name).join(', ')} for ${mLabel(g,g.currentMonth)}.`,new Date());render(true);toast(`${plural(np.length,'reminder','reminders')} recorded.`);break;}
    case 'ask-type':askType(g);break;
    case 'more-hist':S.histLimit+=40;render(true);break;
    case 'new-group':S.gid=null;S.draft=newDraft();S.screen='create';go();break;
    case 'cg-add':syncDraft();if(S.draft.members.length<MAXM[S.draft.type]){S.draft.members.push({name:'',phone:'',role:'member'});render(true);const el=document.getElementById('cm-name-'+(S.draft.members.length-1));el&&el.focus()}break;
    case 'cg-remove':syncDraft();S.draft.members.splice(+b.dataset.i,1);render(true);break;
    case 'save-group':saveGroup();break;
    case 'modal-close':closeModal();break;
    case 'modal-bg':if(e.target===b)closeModal();break;
    case 'modal-save':{
      if(!S.modalSave)break;const r=S.modalSave();
      if(typeof r==='string'){document.getElementById('m-err').innerHTML=`<div class="errors">${esc(r)}</div>`}
      else{mroot.innerHTML='';S.modalSave=null}
      break;}
  }
});
function updateRefField(prefix,method){
  const m=M(method),wrap=document.getElementById(prefix+'-refwrap'),cash=document.getElementById(prefix+'-cashhint');
  if(!wrap)return;
  wrap.hidden=m.id==='cash';cash.hidden=m.id!=='cash';
  document.getElementById(prefix+'-reflabel').textContent=m.needsRef?'Transaction reference':'Deposit slip number (optional)';
  document.getElementById(prefix+'-refhint').textContent=m.hint;
}
document.addEventListener('change',e=>{
  const t=e.target,g=cur();
  if(t.id==='viewas'){
    S.role=t.value;
    if(g&&!isT(g)&&['record','request','move'].includes(S.screen))S.screen={record:'payments',request:'approvals',move:'overview'}[S.screen];
    render(true);
    if(g)toast(`Now showing what ${viewer(g).name} sees.`);
    return;
  }
  if(t.id==='pay-month'){S.payMonth=t.value;render(true);return}
  if(t.name==='f-method'){updateRefField('f',t.value);return}
  if(t.name==='m-method'){updateRefField('m',t.value);return}
  if(t.name==='r-kind'){S.reqKind=t.value;render(true);return}
  if(t.id==='ln-months'){refreshLoanCalc(g);return}
  if(t.name==='cg-type'){syncDraft();S.draft.type=t.value;render(true);return}
});
function refreshLoanCalc(g){const box=document.getElementById('ln-calc');if(box&&g)box.innerHTML=loanCalcBox(g,val('ln-amount'),+val('ln-months'))}
document.addEventListener('input',e=>{
  const g=cur();
  if(e.target.id==='ln-amount'){refreshLoanCalc(g);return}
  if(e.target.id==='r-amount'&&g){
    const h=holdings(g);const v=parseFloat(e.target.value)||0;
    const s=fillSources(v,h,['momo','cash','bank']);
    ['momo','cash','bank'].forEach(k=>{const el=document.getElementById('src-'+k);if(el)el.value=s[k]||''});
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mroot.innerHTML)closeModal()});

render(false);
})();
</script>
