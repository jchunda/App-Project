<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Usambazi</title>
<meta name="description" content="Clear, shared records for chilimbas and village banking groups.">

<!-- Fonts from Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- The app draws every screen inside this box (see js/app.js). -->
<div id="app">
  <main class="content"><p class="muted">Loading Usambazi…</p></main>
</div>

<!-- Pop-up boxes (for example "Fix with a correction") appear here. -->
<div id="modal-root"></div>

<!-- Short messages such as "Group created" appear here. -->
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- Scripts: classic tags (not type="module") so the page works when
     opened straight from your computer. Order matters:
     1. Supabase library  2. your keys  3. helpers  4. screens  5. the app -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="js/helpers.js"></script>
<script src="js/screens.js"></script>
<script src="js/app.js"></script>
</body>
</html>
